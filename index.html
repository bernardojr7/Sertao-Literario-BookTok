<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sertão Literário</title>
  
  <!-- Fonts: Special Elite (Cordel) e Bitter (Leitura) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,400;0,600;0,700;1,400&family=Special+Elite&display=swap" rel="stylesheet" />

  <!-- Firebase Compat Libraries -->
  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore-compat.js"></script>

  <!-- Chart.js para Gráficos Interativos -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- html2pdf.js para Exportação do Relatório em PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    /* =========================================================
       VARIÁVEIS E DEFINIÇÃO DOS TEMAS
       ========================================================= */
    
    :root, body[data-theme="default"] {
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --surface2: #F1F5F9;
      --text: #0F172A;
      --muted: #64748B;
      --border: #CBD5E1;
      --primary: #2563EB;
      --primary-dark: #1D4ED8;
      --green: #10B981;
      --cyan: #06B6D4;
      --danger: #EF4444;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      --radius: 8px;
      --font-title: 'Bitter', serif;
      --font-body: 'Bitter', serif;
    }

    body[data-theme="default"].dark {
      --bg: #0F172A;
      --surface: #1E293B;
      --surface2: #334155;
      --text: #F8FAFC;
      --muted: #94A3B8;
      --border: #334155;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
    }

    body[data-theme="cordel"] {
      --bg: #F3E9DC;
      --surface: #EADBC8;
      --surface2: #DFCFB8;
      --text: #1A1817;
      --muted: #5C5248;
      --border: #1A1817;
      --primary: #C05C33;
      --primary-dark: #A04420;
      --green: #2D6A4F;
      --cyan: #E5A93C;
      --danger: #B23B23;
      --shadow: 4px 4px 0px #1A1817;
      --radius: 6px;
      --font-title: 'Special Elite', cursive, serif;
      --font-body: 'Bitter', serif;
    }

    body[data-theme="cordel"].dark {
      --bg: #1A1817;
      --surface: #2A2421;
      --surface2: #362E2A;
      --text: #F3E9DC;
      --muted: #B8A99A;
      --border: #F3E9DC;
      --shadow: 4px 4px 0px #F3E9DC;
    }

    body[data-theme="sertao-cyber"] {
      --bg: #090D16;
      --surface: #111827;
      --surface2: #1F2937;
      --text: #F3F4F6;
      --muted: #9CA3AF;
      --border: #06B6D4;
      --primary: #10B981;
      --primary-dark: #059669;
      --green: #10B981;
      --cyan: #06B6D4;
      --danger: #F43F5E;
      --shadow: 0 0 12px rgba(6, 182, 212, 0.3);
      --radius: 8px;
      --font-title: 'Special Elite', cursive, serif;
      --font-body: 'Bitter', serif;
    }

    body[data-theme="luar-sertao"] {
      --bg: #0B132B;
      --surface: #1C2541;
      --surface2: #2A365C;
      --text: #EDF2F4;
      --muted: #8D99AE;
      --border: #3A506B;
      --primary: #5BC0BE;
      --primary-dark: #3A9392;
      --green: #10B981;
      --cyan: #6FFFE9;
      --danger: #EF4444;
      --shadow: 0 4px 12px rgba(91, 192, 190, 0.25);
      --radius: 8px;
      --font-title: 'Bitter', serif;
      --font-body: 'Bitter', serif;
    }

    body[data-theme="caatinga-florida"] {
      --bg: #FDF0ED;
      --surface: #FFFFFF;
      --surface2: #F7D6D0;
      --text: #2D1A17;
      --muted: #8C5A52;
      --border: #E63946;
      --primary: #E63946;
      --primary-dark: #C1121F;
      --green: #2A9D8F;
      --cyan: #E9C46A;
      --danger: #D62828;
      --shadow: 3px 3px 0px #E63946;
      --radius: 10px;
      --font-title: 'Special Elite', cursive, serif;
      --font-body: 'Bitter', serif;
    }

    body[data-theme="sol-dourado"] {
      --bg: #FFFBEA;
      --surface: #FFF3C4;
      --surface2: #FFE89C;
      --text: #3D2600;
      --muted: #855B14;
      --border: #B45309;
      --primary: #D97706;
      --primary-dark: #B45309;
      --green: #059669;
      --cyan: #F59E0B;
      --danger: #DC2626;
      --shadow: 3px 3px 0px #B45309;
      --radius: 6px;
      --font-title: 'Bitter', serif;
      --font-body: 'Bitter', serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      transition: background .25s, color .25s;
    }

    .emoji-custom {
      width: 1.25em;
      height: 1.25em;
      vertical-align: -0.2em;
      display: inline-block;
      object-fit: contain;
      user-select: none;
      pointer-events: none;
    }

    h1, h2, h3, h4, .brand, .page-title h1, .stat-value, .book-cover {
      font-family: var(--font-title) !important;
      letter-spacing: 0.5px;
    }

    button, input, select, textarea { font: inherit; }
    button { border: 0; cursor: pointer; }
    .hidden { display: none !important; }

    /* Toast Notifications */
    .toast {
      position: fixed; right: 22px; top: 22px; z-index: 50;
      max-width: 380px; padding: 16px 20px; border-radius: var(--radius);
      color: var(--bg); background: var(--text); border: 2px solid var(--border);
      box-shadow: var(--shadow); transform: translateY(-12px); opacity: 0; transition: .25s;
      font-weight: 600;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { background: var(--green); color: #fff; }
    .toast.error { background: var(--danger); color: #fff; }

    /* Auth Page */
    .auth-layout { 
      min-height: 100vh; 
      display: grid; 
      grid-template-columns: minmax(0, 1.1fr) minmax(280px, 0.9fr); 
    }
    .auth-hero {
      position: relative; overflow: hidden; padding: 70px clamp(30px, 7vw, 110px);
      color: #F3E9DC;
      background: linear-gradient(135deg, rgba(26,24,23,0.92), rgba(192,92,51,0.85)),
                  url('https://down-br.img.susercontent.com/file/br-11134207-7r98o-lyjxah0w0gmd6a') center/cover;
      border-right: 3px solid var(--border);
    }
    .auth-hero-content { position: relative; z-index: 1; max-width: 620px; margin-top: 18vh; }
    .auth-hero-content h1 { font-size: clamp(32px, 5.5vw, 70px); line-height: 1.05; margin: 20px 0; text-shadow: 2px 2px 0px #1A1817; }
    .auth-hero-content p { max-width: 560px; color: rgba(243,233,220,0.9); font-size: 18px; line-height: 1.6; }

    .auth-panel { display: grid; place-items: center; padding: 20px; background: var(--bg); }
    .auth-card {
      width: min(100%, 470px); padding: 40px;
      border: 2px solid var(--border); border-radius: var(--radius);
      background: var(--surface); box-shadow: var(--shadow);
    }
    .auth-card h2 { font-size: 32px; margin-bottom: 8px; }
    .auth-card > p { color: var(--muted); margin-bottom: 28px; }

    .auth-tabs {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 5px; margin-bottom: 24px;
      border-radius: var(--radius); background: var(--surface2); border: 1px solid var(--border);
    }
    .auth-tabs button { padding: 12px; border-radius: 4px; color: var(--muted); background: transparent; font-weight: 700; }
    .auth-tabs button.active { color: var(--text); background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); }

    /* Form Components */
    .form-grid { display: grid; gap: 16px; }
    label { display: grid; gap: 7px; color: var(--text); font-size: 13px; font-weight: 700; text-transform: uppercase; }
    input, select, textarea {
      width: 100%; padding: 12px 14px; border: 2px solid var(--border); border-radius: var(--radius);
      outline: none; color: var(--text); background: var(--bg); transition: border .2s;
    }
    textarea { min-height: 90px; resize: vertical; }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); }

    .checkbox-group {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; padding: 10px;
      background: var(--surface2); border: 2px solid var(--border); border-radius: var(--radius);
    }
    .checkbox-item { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text); cursor: pointer; text-transform: none; }
    .checkbox-item input { width: auto; }

    .primary-btn, .secondary-btn, .danger-btn, .btn-editar {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 44px; padding: 10px 18px; border-radius: var(--radius); font-weight: 700;
      border: 2px solid var(--border); transition: transform .1s, box-shadow .1s;
      box-shadow: var(--shadow); text-transform: uppercase; font-size: 13px;
    }
    .primary-btn { color: #fff; background: var(--primary); }
    .secondary-btn, .btn-editar { color: var(--text); background: var(--surface2); }
    .danger-btn { color: white; background: var(--danger); }
    .primary-btn:hover, .secondary-btn:hover, .danger-btn:hover, .btn-editar:hover { transform: translate(-2px, -2px); }
    .primary-btn:active, .secondary-btn:active, .danger-btn:active, .btn-editar:active { transform: translate(1px, 1px); }
    .full { width: 100%; }

    /* Main App Layout */
    .app-shell { min-height: 100vh; padding-bottom: 92px; }
    .topbar {
      position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 16px clamp(14px, 5vw, 70px);
      border-bottom: 2px solid var(--border);
      background: var(--surface);
    }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 24px; font-weight: 800; cursor: pointer; }
    .brand-mark {
      width: 40px; height: 40px; display: grid; place-items: center; border-radius: var(--radius);
      background: var(--primary); color: #fff; font-size: 20px; border: 2px solid var(--border);
      box-shadow: var(--shadow); overflow: hidden; flex-shrink: 0;
    }
    .brand-mark img { width: 100%; height: 100%; object-fit: cover; }
    
    .top-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border: 2px solid var(--border); border-radius: var(--radius); color: var(--text); background: var(--surface2); box-shadow: var(--shadow); font-weight: bold; flex-shrink: 0; }
    .user-pill { display: flex; align-items: center; gap: 8px; padding: 4px 10px 4px 4px; border: 2px solid var(--border); border-radius: var(--radius); background: var(--surface2); font-weight: 600; font-size: 13px; }
    
    .avatar {
      width: 32px; height: 32px; border-radius: var(--radius);
      background: var(--primary); border: 2px solid var(--border);
      color: white; font-weight: 800; font-size: 13px;
      display: grid; place-items: center; overflow: hidden; flex-shrink: 0;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }

    .page { width: min(1400px, 100%); margin: 0 auto; padding: 24px clamp(14px, 5vw, 70px); }
    .page-title { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
    .page-title h1 { font-size: clamp(28px, 4.5vw, 48px); line-height: 1.1; }
    .page-title p { margin-top: 6px; color: var(--muted); font-size: 14px; }

    /* Dashboard Widgets */
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    .stat-card {
      position: relative; overflow: hidden; padding: 16px; border: 2px solid var(--border);
      border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow);
    }
    .stat-label { color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .stat-value { font-size: 28px; line-height: 1.1; margin-top: 6px; color: var(--primary); display: flex; align-items: center; gap: 6px; }
    .stat-icon { margin-bottom: 6px; font-size: 22px; }

    .panel { border: 2px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); padding: 20px; }
    .panel-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    .panel-header h2 { font-size: 22px; }
    .content-grid { display: grid; grid-template-columns: 1.35fr 0.65fr; gap: 18px; margin-top: 18px; }

    .progress-list { display: grid; gap: 16px; }
    .progress-info { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 13px; font-weight: 600; }
    .progress { height: 12px; border-radius: var(--radius); background: var(--bg); border: 2px solid var(--border); overflow: hidden; }
    .progress > div { height: 100%; background: var(--primary); transition: width 0.2s ease; }

    .ranking { display: grid; gap: 10px; }
    .ranking-item { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: var(--radius); border: 2px solid var(--border); background: var(--bg); cursor: pointer; transition: transform .15s; }
    .ranking-item:hover { transform: translateX(4px); }
    .ranking-pos { width: 24px; color: var(--primary); font-weight: 800; text-align: center; font-family: var(--font-title); }
    .ranking-name { flex: 1; font-weight: 600; font-size: 14px; word-break: break-word; }
    .xp-badge { padding: 4px 8px; border-radius: 4px; border: 1px solid var(--border); color: var(--text); background: var(--cyan); font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }

    /* Book Cards & Styles */
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
    .book-card, .card-livro, .post-card, .campaign-card {
      overflow: hidden; border: 2px solid var(--border); border-radius: var(--radius);
      background: var(--surface); box-shadow: var(--shadow); display: flex; flex-direction: column;
    }
    .book-cover { height: 180px; display: grid; place-items: center; background: var(--surface2); color: var(--text); border-bottom: 2px solid var(--border); font-size: 32px; overflow: hidden; position: relative; }
    .book-cover img { width: 100%; height: 100%; object-fit: cover; }
    .book-content, .post-content, .campaign-content { padding: 16px; flex: 1; display: flex; flex-direction: column; }
    .book-content h3, .campaign-content h3, .card-livro .titulo { margin-bottom: 4px; font-size: 18px; }
    .book-content p.autor, .card-livro .autor { color: var(--muted); font-size: 12px; font-weight: 600; margin-bottom: 8px; }
    
    .card-livro .resumo {
      color: var(--text); font-size: 12px; line-height: 1.5; font-style: italic;
      margin: 8px 0 12px 0; flex: 1; display: -webkit-box; -webkit-line-clamp: 3;
      -webkit-box-orient: vertical; overflow: hidden; background: var(--bg);
      padding: 8px 10px; border-radius: var(--radius); border: 1px solid var(--border);
      border-left: 4px solid var(--primary);
    }

    .book-meta, .card-livro .acoes { display: flex; align-items: center; justify-content: space-between; margin-top: auto; gap: 8px; flex-wrap: wrap; }

    .tag, .status {
      display: inline-flex; padding: 4px 8px; border-radius: 4px; border: 1px solid var(--border);
      color: var(--text); background: var(--cyan); font-size: 10px; font-weight: 700; margin-bottom: 6px; align-self: flex-start; text-transform: uppercase; align-items: center; gap: 4px;
    }
    .tag-restricted {
      background: var(--danger) !important; color: #fff !important;
    }

    .post-video {
      width: 100%;
      aspect-ratio: 9 / 16;
      max-height: 520px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000000;
      border-bottom: 2px solid var(--border);
      color: #fff;
      overflow: hidden;
      position: relative;
      margin: 0 auto;
    }

    .post-video video { width: 100%; height: 100%; object-fit: contain; background: #000; }
    .post-video img { width: 100%; height: 100%; object-fit: cover; }
    .student-card:hover { transform: translate(-2px, -2px); box-shadow: var(--shadow); }

    .tab-pills { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 16px; -webkit-overflow-scrolling: touch; }
    .tab-pill { padding: 8px 14px; border-radius: var(--radius); background: var(--bg); border: 2px solid var(--border); font-weight: 700; font-size: 12px; color: var(--text); cursor: pointer; white-space: nowrap; }
    .tab-pill.active { background: var(--primary); color: white; box-shadow: var(--shadow); }

    .empty-state { padding: 30px 16px; color: var(--muted); text-align: center; font-style: italic; font-size: 14px; }

    /* Modal */
    .modal {
      position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 14px;
      background: rgba(0,0,0,0.65); backdrop-filter: blur(4px);
    }
    .modal-card { width: min(100%, 600px); max-height: calc(100vh - 28px); overflow-y: auto; padding: 20px; border: 3px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
    .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
    .modal-header h2 { font-size: 22px; }

    /* Bottom Navigation Bar */
    .bottom-nav {
      position: fixed; left: 50%; bottom: 12px; z-index: 40;
      width: min(680px, calc(100% - 20px));
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 4px;
      border: 2px solid var(--border); border-radius: var(--radius);
      background: var(--surface); box-shadow: var(--shadow);
      transform: translateX(-50%);
    }
    .nav-btn { display: grid; justify-items: center; gap: 2px; padding: 6px 2px; border-radius: 4px; color: var(--muted); background: transparent; font-size: 10px; font-weight: 700; }
    .nav-btn span:first-child { font-size: 18px; display: inline-flex; justify-content: center; align-items: center; }
    .nav-btn.active { color: var(--text); background: var(--cyan); border: 1px solid var(--border); box-shadow: var(--shadow); }

    /* ESTILOS DO MÓDULO DE RELATÓRIOS E ANALYTICS */
    .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
    .chart-card { background: var(--surface); border: 2px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); position: relative; }
    .chart-container { position: relative; width: 100%; height: 240px; }
    
    .presentation-active {
      position: fixed !important; inset: 0 !important; z-index: 9999 !important;
      background: var(--bg) !important; padding: 20px !important; overflow-y: auto !important;
    }

    .highlight-box {
      background: var(--surface2); border: 2px dashed var(--primary);
      border-radius: var(--radius); padding: 16px; margin-bottom: 20px;
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    }

    .section-space { margin-top: 24px; }
    .muted { color: var(--muted); }
    .flex { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }

    @media (max-width: 1050px) {
      .auth-layout { grid-template-columns: 1fr; }
      .auth-hero { min-height: 240px; padding: 30px 20px; }
      .auth-hero-content { margin-top: 0; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .content-grid, .chart-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 640px) {
      .auth-hero { min-height: 180px; padding: 20px 16px; }
      .auth-hero-content h1 { font-size: 28px; }
      .auth-hero-content p { font-size: 14px; }
      .auth-panel { padding: 12px; }
      .auth-card { padding: 20px 16px; }

      .topbar { padding: 10px 14px; }
      .brand span { font-size: 18px; }
      .user-pill span { display: none; }
      .user-pill { padding: 2px; }

      .page { padding: 16px 12px 100px; }
      .page-title h1 { font-size: 26px; }

      .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .stat-card { padding: 12px; }
      .stat-value { font-size: 22px; }

      .cards-grid { grid-template-columns: 1fr; gap: 14px; }
      .bottom-nav { width: calc(100% - 16px); bottom: 8px; padding: 4px; }
      .nav-btn { font-size: 9px; padding: 4px 2px; }
      .nav-btn span:first-child { font-size: 16px; }

      .primary-btn, .secondary-btn, .danger-btn, .btn-editar {
        min-height: 38px; padding: 8px 12px; font-size: 11px;
      }

      .highlight-box { flex-direction: column; align-items: flex-start; gap: 10px; }
      .chart-container { height: 200px; }
    }
  </style>
</head>
<body>

  <div id="app"></div>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="modalTitle">Título</h2>
        <button id="closeModalBtn" class="icon-btn" onclick="closeModal()">×</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    // --- FIREBASE CONFIGURATION ---
    const firebaseConfig = {
      apiKey: "AIzaSyA-xVOI6qXkEndKXkSp6-zRLY01qNkQH4E",
      authDomain: "sertao-literario-booktok.firebaseapp.com",

    const CLOUDINARY_CLOUD_NAME = "w0pi8vpn"; 
    const CLOUDINARY_UPLOAD_PRESET = "sertão literário"; 

    async function uploadToCloudinary(file, onProgress = null) {
      if (!file) return null;
      const url = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/auto/upload`;
      const formData = new FormData();
      formData.append("file", file);
      formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);

      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open("POST", url);

        if (onProgress && xhr.upload) {
          xhr.upload.onprogress = (e) => {
            if (e.lengthComputable) {
              const percent = Math.round((e.loaded / e.total) * 100);
              onProgress(percent);
            }
          };
        }

        xhr.onload = () => {
          if (xhr.status >= 200 && xhr.status < 300) {
            const res = JSON.parse(xhr.responseText);
            resolve(res.secure_url);
          } else {
            reject(new Error("Erro ao enviar imagem/vídeo para o Cloudinary"));
          }
        };

        xhr.onerror = () => reject(new Error("Erro de conexão com o Cloudinary"));
        xhr.send(formData);
      });
    }

          approvedBy: currentUser.uid,
          approvedAt: new Date().toISOString()
        });

        const studentRef = db.collection("users").doc(r.userId);
        const updates = {
          xp: firebase.firestore.FieldValue.increment(r.xpEarned || 0),
          cactoscoins: firebase.firestore.FieldValue.increment(r.coinsEarned || 0)

    async function loadStudentsByClass(className) {
      const container = $("#studentsListContainer");
      if (!container) return;
      try {
        const snap = await db.collection("users")
          .where("role", "==", "student")
          .where("className", "==", className)
          .get();

        if (snap.empty) {
          container.innerHTML = `<div class="empty-state">Nenhum aluno cadastrado na turma ${className}.</div>`;

    async function loadReportData() {
      const container = $("#reportContentArea");
      if (!container) return;

      try {
        const studentsSnap = await db.collection("users")
          .where("role", "==", "student")
          .where("className", "==", selectedTeacherClass)
          .get();

        const students = [];
        studentsSnap.forEach(d => students.push({ id: d.id, ...d.data() }));

        const totalAlunos = students.length;
        let totalLivrosLidos = 0;
        let totalPaginasLidas = 0;
        let alunosAtivos = 0;

        students.forEach(s => {
          const books = s.booksRead || 0;
          totalLivrosLidos += books;
          if (books > 0) alunosAtivos++;
        });

        const studentIds = students.map(s => s.id);
        let categoryMap = { "Literatura Sertaneja": 0, "Poesia & Cordel": 0, "Ficção": 0, "Outros": 0 };
        let monthlyData = [5, 12, 18, 25, 30, totalLivrosLidos > 30 ? totalLivrosLidos : 35];

        if (studentIds.length > 0) {
          const readingsSnap = await db.collection("readings").get();
          readingsSnap.forEach(doc => {
            const r = doc.data();
            if (studentIds.includes(r.userId)) {
              totalPaginasLidas += (r.pagesRead || 0);
            }
          });
        }

        const taxaEngajamento = totalAlunos > 0 ? Math.round((alunosAtivos / totalAlunos) * 100) : 0;
        const mediaLivros = totalAlunos > 0 ? (totalLivrosLidos / totalAlunos).toFixed(1) : 0;

        container.innerHTML = `
          <div class="highlight-box" style="background:var(--surface);border-style:solid">
            <span style="font-size:42px">${emoji('chapeu')}</span>
            <div>
              <h3 style="margin-bottom:4px">Destaque de Desempenho (${selectedTeacherClass})</h3>
              <p style="font-size:14px;color:var(--text)">
                A turma registrou um total de <strong>${totalLivrosLidos} livros lidos</strong> neste período, com uma taxa de engajamento leitor de <strong>${taxaEngajamento}%</strong>!
              </p>
            </div>
          </div>

          <div class="stats-grid">
            ${statCard(emoji('cordel'), "Total de Livros Lidos", totalLivrosLidos)}
            ${statCard("📄", "Páginas Lidas", totalPaginasLidas)}
            ${statCard("🔥", "Engajamento da Turma", taxaEngajamento + "%")}
            ${statCard("📊", "Média por Aluno", mediaLivros)}
          </div>

          <div class="chart-grid">
            <div class="chart-card">
              <h3>Evolução de Leitura (Mensal)</h3>
              <div class="chart-container">
                <canvas id="chartEvolucao"></canvas>
              </div>
            </div>
            <div class="chart-card">
              <h3>Gêneros / Categorias Mais Lidas</h3>
              <div class="chart-container">
                <canvas id="chartCategorias"></canvas>
              </div>
            </div>
          </div>

          <section class="panel section-space">
            <div class="panel-header">
              <h2>Desempenho Detalhado dos Alunos</h2>
              <span class="tag">${students.length} Alunos</span>
            </div>
            <div class="progress-list">
              ${students.length ? students.map(st => `
                <div class="ranking-item" style="cursor:default">
                  ${renderAvatar(st.photoURL, st.name)}
                  <div class="ranking-name">
                    <strong>${st.name}</strong>
                    <div class="muted" style="font-size:11px">XP: ${st.xp || 0} • Cactoscoins: ${emoji('cactocoin')} ${st.cactoscoins || 0}</div>
                  </div>
                  <div style="text-align:right">
                    <span class="xp-badge" style="background:var(--primary);color:#fff">${emoji('cordel')} ${st.booksRead || 0} livros</span>
                  </div>
                </div>
              `).join("") : '<div class="empty-state">Nenhum aluno cadastrado nesta turma.</div>'}
            </div>
          </section>
        `;

        renderCharts(monthlyData, categoryMap);

      } catch(error) {
        console.log(error);
        container.innerHTML = `<div class="empty-state">Erro ao carregar estatísticas do relatório.</div>`;
      }
    }

    function renderCharts(monthlyData, categoryMap) {
      const primaryColor = getComputedStyle(document.body).getPropertyValue('--primary').trim() || '#2563EB';
      const cyanColor = getComputedStyle(document.body).getPropertyValue('--cyan').trim() || '#06B6D4';
      const greenColor = getComputedStyle(document.body).getPropertyValue('--green').trim() || '#10B981';

      if (chartEvolucaoInstance) chartEvolucaoInstance.destroy();
      if (chartCategoriasInstance) chartCategoriasInstance.destroy();

      const ctx1 = document.getElementById('chartEvolucao');
      if (ctx1) {
        chartEvolucaoInstance = new Chart(ctx1, {
          type: 'line',
          data: {
            labels: ['Mês 1', 'Mês 2', 'Mês 3', 'Mês 4', 'Mês 5', 'Atual'],
            datasets: [{
              label: 'Livros Lidos Acumulados',
              data: monthlyData,
              borderColor: primaryColor,
              backgroundColor: primaryColor + '22',
              fill: true,
              tension: 0.3,
              borderWidth: 3
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } }
          }
        });
      }

      const ctx2 = document.getElementById('chartCategorias');
      if (ctx2) {
        chartCategoriasInstance = new Chart(ctx2, {
          type: 'doughnut',
          data: {
            labels: ['Cordel & Sertão', 'Poesia', 'Contos & Ficção', 'Outros'],
            datasets: [{
              data: [45, 25, 20, 10],
              backgroundColor: [primaryColor, cyanColor, greenColor, '#F59E0B']
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false
          }
        });
      }
    }

    function showCampaignModal(id = null, dataJson = null) {
      const data = dataJson ? JSON.parse(decodeURIComponent(dataJson)) : {};
      openModal(id ? "Editar Campanha" : "Nova Campanha", `
        <form id="campaignForm" class="form-grid">
          <label>Título <input name="title" value="${data.title || ''}" required /></label>
          <label>Descrição <textarea name="description" required>${data.description || ''}</textarea></label>
          <label>Ícone / Banner Emoji <input name="banner" value="${data.banner || '🌵'}" placeholder="Ex: 🏜️ ou 📜" /></label>

        </form>`);

      document.getElementById("campaignForm").onsubmit = async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const payload = {
          title: fd.get("title"), description: fd.get("description"),
          banner: fd.get("banner"), isActive: true, updatedAt: new Date().toISOString()
        };

        if (id) {
          await db.collection("campaigns").doc(id).update(payload);
          toast("Campanha atualizada!", "success");
        } else {
          payload.createdAt = new Date().toISOString();
          await db.collection("campaigns").add(payload);
          toast("Campanha criada!", "success");
        }
        closeModal();
        renderHome();
      };
    }
    window.showCampaignModal = showCampaignModal;

    // --- 📚 BIBLIOTECA SERTANEJA (ATUALIZADA) ---

    async function renderLibrary() {
      let books = [];
      try {
        const snap = await db.collection("books").get();
        snap.forEach(d => {
          const b = d.data();
          if (b.isActive !== false) books.push({ id: d.id, ...b });
        });
      } catch(error) { console.log(error); }

      const isStaff = currentProfile.role !== "student";

      // 1. Livros ordenados por mais recentes para os "Novos Livros"
      const recentBooks = [...books].sort((a,b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0)).slice(0, 4);

      // 2. Livros mais baixados/lidos
      const popularBooks = [...books].sort((a,b) => (b.downloadsCount || 0) - (a.downloadsCount || 0)).slice(0, 4);

      // Helper para renderizar cartão do livro com validação de restrição por turma
      function renderSingleBookCard(b) {
        const coverStyle = b.coverUrl ? `<img src="${b.coverUrl}" alt="Capa" />` : emoji('cordel');
        const isAvailable = isBookAvailableForUser(b, currentProfile);
        const categoryLabel = b.category || "Geral";

        let restrictionBadge = `<span class="tag">${categoryLabel}</span>`;
        if (b.allowedClasses && Array.isArray(b.allowedClasses) && b.allowedClasses.length > 0 && b.allowedClasses.length < TURMAS_DISPONIVEIS.length) {
          restrictionBadge += `<span class="tag ${!isAvailable ? 'tag-restricted' : ''}">🎯 ${b.allowedClasses.join(', ')}</span>`;
        } else {
          restrictionBadge += `<span class="tag" style="background:var(--green);color:#fff">✨ Livre</span>`;
        }

        return `
          <div class="card-livro book-card" data-id="${b.id}" data-category="${categoryLabel}">
            <div class="book-cover">${coverStyle}</div>
            <div class="book-content">
              <div class="flex" style="gap:4px;flex-wrap:wrap">${restrictionBadge}</div>
              <h3 class="titulo">${b.title}</h3>
              <p class="autor">${b.author || "Autor não informado"}</p>
              ${b.summary ? `<p class="resumo">"${b.summary}"</p>` : ''}
              <div class="acoes book-meta">
                ${isAvailable ? `
                  ${b.pdfUrl ? `<a class="secondary-btn" href="${b.pdfUrl}" target="_blank" onclick="incrementBookDownload('${b.id}')" style="font-size:11px;padding:6px 10px">📄 PDF</a>` : ''}
                  ${!isStaff ? `<button class="primary-btn" style="font-size:11px;padding:6px 10px" onclick="openRegisterReadingModal('${b.title.replace(/'/g,"\\'")}')">Registrar Leitura</button>` : ''}
                ` : `
                  <button class="secondary-btn" disabled style="opacity:0.65;cursor:not-allowed;font-size:11px;padding:6px 10px;background:var(--surface2)" title="Livro direcionado para outras turmas">🔒 Restrito</button>
                `}
                ${isStaff ? `
                  <button class="btn-editar" style="font-size:11px;padding:6px 10px" onclick="abrirModalEdicao('${b.id}')">✏️ Editar</button>
                  <button class="danger-btn" style="font-size:11px;padding:6px 10px" data-del="${b.id}">Excluir</button>
                ` : ''}
              </div>
            </div>
          </div>`;
      }

      // Render das categorias / abas
      const categories = ["todas", "Crônicas", "Fábulas", "Poemas", "Cordel", "Outros"];

      let filteredShelfBooks = books;
      if (currentLibraryTab !== "todas") {
        filteredShelfBooks = books.filter(b => (b.category || "Outros").toLowerCase() === currentLibraryTab.toLowerCase());
      }
      filteredShelfBooks.sort((a,b) => (a.title || "").localeCompare(b.title || ""));

      let shelfHtml = filteredShelfBooks.length 
        ? filteredShelfBooks.map(renderSingleBookCard).join("") 
        : '<div class="empty-state">Nenhum livro encontrado nesta estante.</div>';

      $("#pageContent").innerHTML =
        pageTitle(
          "Biblioteca Sertaneja 📚", 
          isStaff ? "Cadastre e gerencie o acervo da escola." : "Escolha sua leitura e registre seu progresso.", 
          isStaff ? '<button class="primary-btn" id="addBookBtn">+ Cadastrar Livro</button>' : ""
        ) +
        
        // DESTAQUE 1: NOVOS LIVROS ADICIONADOS
        (recentBooks.length ? `
        <section class="panel style="margin-bottom:20px">
          <div class="panel-header">
            <h2>✨ Novos Livros na Estante</h2>
            <span class="tag" style="background:var(--primary);color:#fff">Adicionados Recentemente</span>
          </div>
          <div class="cards-grid">${recentBooks.map(renderSingleBookCard).join("")}</div>
        </section>
        <div style="margin-bottom:20px"></div>
        ` : '') +

        // DESTAQUE 2: MAIS BAIXADOS / LIDOS
        (popularBooks.length ? `
        <section class="panel" style="margin-bottom:20px">
          <div class="panel-header">
            <h2>🔥 Mais Baixados & Lidos</h2>
            <span class="tag" style="background:var(--cyan);color:var(--text)">Populares da Galera</span>
          </div>
          <div class="cards-grid">${popularBooks.map(renderSingleBookCard).join("")}</div>
        </section>
        <div style="margin-bottom:20px"></div>
        ` : '') +

        // ESTANTE ORGANIZADA EM ABAS
        `<section class="panel">
          <div class="panel-header">
            <h2>Estante de Livros</h2>
            <input id="searchInput" placeholder="🔍 Buscar por título, autor..." style="max-width:280px" />
          </div>

          <div class="tab-pills" style="margin-bottom:16px">
            ${categories.map(cat => `
              <button class="tab-pill ${currentLibraryTab === cat ? 'active' : ''}" onclick="selectLibraryTab('${cat}')">
                ${cat === 'todas' ? '📚 Todas as Estantes' : cat}
              </button>
            `).join('')}
          </div>

          <div id="booksGrid" class="cards-grid">${shelfHtml}</div>
        </section>`;

      // Busca na estante
      $("#searchInput").oninput = (e) => {
        const t = e.target.value.toLowerCase();
        $$("#booksGrid .card-livro").forEach(card => {
          card.style.display = card.textContent.toLowerCase().includes(t) ? "" : "none";
        });
      };

      // Modal de Cadastro com Restrição por Turma
      const addBtn = $("#addBookBtn");
      if (addBtn) {
        addBtn.onclick = () => {
          openModal("Cadastrar Novo Livro", `
            <form id="bookForm" class="form-grid">
              <label>Título <input name="title" required placeholder="Ex: O Leão e o Rato / As Crônicas da Vila" /></label>
              <label>Autor <input name="author" required placeholder="Ex: Monteiro Lobato" /></label>
              <label>Páginas <input name="pages" type="number" min="1" required placeholder="Ex: 80" /></label>

              <label>Gênero / Categoria
                <select name="category" required id="categorySelect">
                  <option value="Fábulas">Fábulas (Livre para todos)</option>
                  <option value="Poemas">Poemas (Livre para todos)</option>
                  <option value="Cordel">Cordel (Livre para todos)</option>
                  <option value="Crônicas">Crônicas (Ex: 8º e 9º Ano)</option>
                  <option value="Outros">Outros</option>
                </select>
              </label>

              <label>🎯 Turmas Autorizadas (Direcionamento de Acesso)
                <div class="checkbox-group" style="margin-top:6px">
                  ${TURMAS_DISPONIVEIS.map(t => `
                    <label class="checkbox-item">
                      <input type="checkbox" name="allowedClasses" value="${t}" checked /> ${t}
                    </label>
                  `).join('')}
                </div>
                <span class="muted" style="font-size:11px;text-transform:none">Desmarque as turmas que NÃO poderão baixar nem ler este livro.</span>
              </label>

              <label>Resumo / Sinopse <textarea name="summary" placeholder="Escreva um breve resumo..."></textarea></label>
              <label>Capa - Escolher Imagem <input type="file" id="inpCoverFile" accept="image/*" /></label>
              <label>Ou Link/URL da Capa <input name="coverUrl" id="inpCoverUrl" placeholder="https://..." /></label>
              <label>Link do PDF (Opcional) <input name="pdfUrl" type="url" placeholder="https://..." /></label>
              <button class="primary-btn full" type="submit">Salvar Livro</button>
            </form>`);

          $("#bookForm").onsubmit = async (e) => {
            e.preventDefault();
            const fd = new FormData(e.target);
            const fileInput = $("#inpCoverFile");
            let coverUrl = fd.get("coverUrl");

            const allowedClasses = Array.from(e.target.querySelectorAll('input[name="allowedClasses"]:checked')).map(cb => cb.value);

            if (fileInput && fileInput.files && fileInput.files[0]) {
              try {
                toast("Enviando imagem da capa para o Cloudinary...", "success");
                coverUrl = await uploadToCloudinary(fileInput.files[0]);
              } catch(error) {
                console.log(error);
                return toast("Erro ao enviar imagem da capa.", "error");
              }
            }

            await db.collection("books").add({
              title: fd.get("title"), 
              author: fd.get("author"),
              pages: Number(fd.get("pages")), 
              category: fd.get("category"),
              allowedClasses: allowedClasses,
              summary: fd.get("summary") || "", 
              coverUrl: coverUrl || "",
              pdfUrl: fd.get("pdfUrl") || "", 
              status: "Disponível", 
              downloadsCount: 0,
              isActive: true,
              createdAt: new Date().toISOString()
            });

            closeModal();
            toast("Livro cadastrado com sucesso!", "success");
            renderLibrary();
          };
        };
      }

      $$("[data-del]").forEach(btn => {
        btn.onclick = async function() {
          if (confirm("Excluir este livro?")) {
            await db.collection("books").doc(this.dataset.del).delete();
            toast("Livro removido.");
            renderLibrary();
          }
        };
      });
    }

    // --- STORE ---
    async function renderStore() {
      const isStu = currentProfile.role === "student";

      const coins = currentProfile.cactoscoins || 0;
      const xp = currentProfile.xp || 0;
      const unlocked = currentProfile.unlockedThemes || ["default"];

      let customItems = [];
      try {
        const snap = await db.collection("storeItems").get();
        snap.forEach(d => {
          const item = d.data();
          if (item.isActive !== false) {
            customItems.push({ id: d.id, ...item, type: "reward" });
          }
        });

        console.log(error);
      }

      if (customItems.length === 0) {
        customItems = [
          { id: "default_1", title: "Marca-Página Sertão", description: "Design exclusivo de cordel", priceCoins: 50, requiredXp: 0, icon: "🔖", type: "reward" },
          { id: "default_2", title: "Botton Sertão Literário", description: "Pin colecionável de leitor", priceCoins: 100, requiredXp: 100, icon: emoji('chapeu'), type: "reward" },
          { id: "default_3", title: "Vale-Livro Físico", description: "Troque por um livro novo na escola", priceCoins: 300, requiredXp: 300, icon: emoji('cordel'), type: "reward" }
        ];

      APP_THEMES.filter(t => t.id !== "default").forEach(t => {

          themeId: t.id,
          title: `Tema: ${t.name}`,
          description: t.desc,
          priceCoins: t.priceCoins,
          requiredXp: t.requiredXp,
          icon: t.icon
        });
      });

      const allItems = [...customItems, ...themeItems];

      let itemsHtml = allItems.map((it) => {

              <span class="tag">${isTheme ? "Tema Visual" : "Recompensa"}</span>
              <h3>${it.title}</h3>
              <p>${it.description}</p>
              <div class="book-meta">
                <strong>${emoji('cactocoin')} ${it.priceCoins} • ${emoji('sol')} ${it.requiredXp} XP</strong>
                <div class="flex" style="gap:6px;margin-top:8px">
                  ${isStu ? (
                    isTheme ? (
                      isCurrentThemeActive ? `<span class="tag" style="background:var(--green);color:#fff">Equipado</span>` :
                      isThemeUnlocked ? `<button class="secondary-btn" style="font-size:11px;padding:6px 12px" onclick="equipTheme('${it.themeId}')">Equipar</button>` :
                      `<button class="primary-btn" style="font-size:11px;padding:6px 12px" onclick="buyTheme('${it.themeId}', ${it.priceCoins}, ${it.requiredXp})">Desbloquear</button>`

                  ) : ''}
                  ${isStaff && !isTheme ? `
                    <button class="btn-editar" style="font-size:11px;padding:6px 10px" onclick="showStoreItemModal('${it.id}', '${encodedData}')">✏️ Editar</button>
                    ${it.id && !it.id.startsWith('default_') ? `<button class="danger-btn" style="font-size:11px;padding:6px 10px" onclick="deleteStoreItem('${it.id}')">🗑️</button>` : ''}

              </div>

        pageTitle(

          isStu ? "Troque suas Cactoscoins por recompensas e novos temas!" : "Gerencie os itens, preços e temas da loja.",

        ) +
        `<div class="stats-grid" style="margin-bottom:18px">

      }

      openModal(id && !id.startsWith('default_') ? "✏️ Editar Item da Loja" : "🎁 Novo Item da Loja", `
        <form id="storeItemForm" class="form-grid">

    async function deleteStoreItem(id) {
      if (!id || id.startsWith('default_')) return;
      if (confirm("Deseja realmente remover este item da loja?")) {
        try {
          await db.collection("storeItems").doc(id).delete();
          toast("Item removido da loja.");
          renderStore();
        } catch(error) {
          console.log(error);
          toast("Erro ao remover o item.", "error");
        }
      }
    }
    window.deleteStoreItem = deleteStoreItem;

    async function buyTheme(themeId, priceCoins, requiredXp) {
      const p = currentProfile;
      if ((p.cactoscoins || 0) < priceCoins) return toast("Cactoscoins insuficientes!", "error");
      if ((p.xp || 0) < requiredXp) return toast(`Requer pelo menos ${requiredXp} XP!`, "error");

      const unlocked = p.unlockedThemes || ["default"];
      if (!unlocked.includes(themeId)) unlocked.push(themeId);

      const newCoins = (p.cactoscoins || 0) - priceCoins;

      await db.collection("users").doc(currentUser.uid).update({
        cactoscoins: newCoins,
        unlockedThemes: unlocked
      });

      currentProfile.cactoscoins = newCoins;
      currentProfile.unlockedThemes = unlocked;

      toast("Tema desbloqueado com sucesso!", "success");
      equipTheme(themeId);
    }
    window.buyTheme = buyTheme;

    async function buyReward(itemId, priceCoins, requiredXp) {
      const p = currentProfile;
      if ((p.cactoscoins || 0) < priceCoins) return toast("Cactoscoins insuficientes!", "error");
      if ((p.xp || 0) < requiredXp) return toast(`Requer pelo menos ${requiredXp} XP!`, "error");

      if (!confirm(`Deseja resgatar esta recompensa por ${priceCoins} Cactoscoins?`)) return;

      const newCoins = (p.cactoscoins || 0) - priceCoins;

      try {
        await db.collection("users").doc(currentUser.uid).update({
          cactoscoins: newCoins
        });

        currentProfile.cactoscoins = newCoins;
        toast("Recompensa resgatada! Apresente ao professor na escola.", "success");
        renderStore();
      } catch(error) {
        console.log(error);
        toast("Erro ao processar resgate.", "error");
      }
    }
    window.buyReward = buyReward;

        if (p.imageUrl) {
          mediaContent = `<img src="${p.imageUrl}" alt="Foto da resenha" />`;
        } else if (p.videoUrl) {
          mediaContent = `
            <video 
              src="${p.videoUrl}" 
              controls 
              controlsList="nodownload" 
              playsinline 
              preload="metadata">
            </video>`;
        }
        const isAuthor = currentUser && p.userId === currentUser.uid;
        const isStaff = currentProfile && currentProfile.role !== "student";
        const encodedPost = encodeURIComponent(JSON.stringify(p));

        const isLiked = p.likedBy && Array.isArray(p.likedBy) && p.likedBy.includes(currentUser ? currentUser.uid : "");

        postsHtml += `
          <article class="post-card">
            <div class="post-video">${mediaContent}</div>
            <div class="post-content">
              <div class="flex-between">
                <span class="tag">@${(p.userName || "usuario").toLowerCase().replace(/\s/g,"")}</span>
                ${p.isRepost ? `<span class="tag" style="background:var(--cyan);color:var(--text)">Repostado de @${p.originalAuthor}</span>` : ''}
              </div>
              <h3>${p.title}</h3>
              <p>${p.description || ""}</p>
              <div class="post-actions" style="display:flex;gap:10px;margin-top:10px;align-items:center">
                <button class="like-btn secondary-btn" data-id="${p.id}" data-liked="${isLiked}" style="font-size:12px;padding:6px 10px">
                  ${isLiked ? '❤️' : '🤍'} ${p.likesCount || 0}
                </button>
                <button class="secondary-btn" style="font-size:12px;padding:6px 10px" onclick="openCommentsModal('${p.id}')">💬 ${p.commentsCount || 0}</button>
                <button class="secondary-btn" style="font-size:12px;padding:6px 10px" onclick="repostBookTokPost('${p.id}', '${encodedPost}')">🔁 ${p.repostsCount || 0}</button>
                ${isAuthor || isStaff ? `
                  <button class="btn-editar" style="font-size:10px;padding:4px 8px" onclick="editBookTokPost('${p.id}', '${encodedPost}')">✏️</button>
                  <button class="danger-btn" style="font-size:10px;padding:4px 8px" onclick="deleteBookTokPost('${p.id}')">🗑️</button>
                ` : ''}
              </div>
            </div>
          </article>`;
      }

      $("#pageContent").innerHTML =
        pageTitle(`BookTok Sertanejo ${emoji('booktok')}`, "Envie uma foto ou grave um vídeo para compartilhar suas resenhas literárias.", '<button class="primary-btn" id="newPostBtn">+ Nova Resenha</button>') +
        `<div class="cards-grid">${postsHtml}</div>`;

      const newPostBtn = $("#newPostBtn");
      if (newPostBtn) {
        newPostBtn.onclick = () => showBookTokPostModal();
      }

      $$(".like-btn").forEach(btn => {
        btn.onclick = async function() {
          const postId = this.dataset.id;
          const isLiked = this.dataset.liked === "true";

          if (!currentUser) return toast("Você precisa estar logado.", "error");

          try {
            if (isLiked) {
              await db.collection("posts").doc(postId).update({
                likesCount: firebase.firestore.FieldValue.increment(-1),
                likedBy: firebase.firestore.FieldValue.arrayRemove(currentUser.uid)
              });
              toast("Você descurtiu esta resenha.", "info");
            } else {
              await db.collection("posts").doc(postId).update({
                likesCount: firebase.firestore.FieldValue.increment(1),
                likedBy: firebase.firestore.FieldValue.arrayUnion(currentUser.uid)
              });
              toast("Você curtiu esta resenha!", "success");
            }
            renderBookTok();
          } catch(err) {
            console.error(err);
            toast("Erro ao processar curtida.", "error");
          }
        };
      });
    }

    async function openCommentsModal(postId) {
      openModal("💬 Comentários", '<div class="empty-state">Carregando comentários...</div>');

      try {
        const commentsSnap = await db.collection("posts").doc(postId).collection("comments").orderBy("createdAt", "asc").get();
        let commentsListHtml = "";

        if (commentsSnap.empty) {
          commentsListHtml = '<div class="empty-state">Nenhum comentário ainda. Seja o primeiro a comentar!</div>';
        } else {
          commentsSnap.forEach(doc => {
            const c = doc.data();
            const dateStr = c.createdAt ? new Date(c.createdAt).toLocaleDateString("pt-BR", { hour: '2-digit', minute: '2-digit' }) : "";
            commentsListHtml += `
              <div class="ranking-item" style="cursor:default; margin-bottom:10px; align-items:flex-start;">
                <div>
                  <strong>@${(c.userName || "usuario").toLowerCase().replace(/\s/g, "")}</strong>
                  <span class="muted" style="font-size:11px; margin-left:8px;">${dateStr}</span>
                  <p style="margin-top:4px; font-size:13px; color:var(--text);">${c.text}</p>
                </div>
              </div>
            `;
          });
        }

        const modalBody = `
          <div style="max-height: 280px; overflow-y: auto; margin-bottom: 16px; padding-right: 4px;">
            ${commentsListHtml}
          </div>
          <form id="commentForm" class="form-grid">
            <label>Escreva seu comentário:
              <textarea id="commentText" name="text" placeholder="Digite aqui o que achou..." required style="min-height:70px;"></textarea>
            </label>
            <button class="primary-btn full" type="submit" id="submitCommentBtn">Enviar Comentário</button>
          </form>
        `;

        openModal("💬 Comentários", modalBody);

        $("#commentForm").onsubmit = async (e) => {
          e.preventDefault();
          const text = $("#commentText").value.trim();
          if (!text) return;

          const submitBtn = $("#submitCommentBtn");
          submitBtn.disabled = true;
          submitBtn.textContent = "Enviando...";

          try {
            await db.collection("posts").doc(postId).collection("comments").add({
              userId: currentUser.uid,
              userName: currentProfile.name || "Usuário",
              text: text,
              createdAt: new Date().toISOString()
            });

            await db.collection("posts").doc(postId).update({
              commentsCount: firebase.firestore.FieldValue.increment(1)
            });

            toast("Comentário enviado!", "success");
            openCommentsModal(postId);
            renderBookTok();
          } catch(err) {
            console.error(err);
            toast("Erro ao enviar comentário.", "error");
            submitBtn.disabled = false;
            submitBtn.textContent = "Enviar Comentário";
          }
        };

      } catch(err) {
        console.error(err);
        toast("Erro ao carregar comentários.", "error");
      }
    }
    window.openCommentsModal = openCommentsModal;

    function showBookTokPostModal(id = null, dataJson = null) {
      const data = dataJson ? JSON.parse(decodeURIComponent(dataJson)) : {};
      openModal(id ? "✏️ Editar Resenha BookTok" : "📹 Nova Resenha BookTok", `
        <form id="bookTokPostForm" class="form-grid">
          <label>Título da Resenha
            <input name="title" value="${data.title || ''}" required placeholder="Ex: Minha opinião sobre Vidas Secas" />
          </label>
          <label>Descrição / Opinião
            <textarea name="description" required placeholder="O que você achou do livro? Compartilhe seus destaques...">${data.description || ''}</textarea>
          </label>
          
          <div id="mediaUploadOption">
            <label>📸 Selecionar Imagem ou Vídeo:
              <input type="file" id="inpPostMediaFile" accept="image/*,video/*" style="padding: 8px;" />
            </label>
            <label style="margin-top:8px">Ou URL Direta da Mídia (Opcional):
              <input name="mediaUrl" value="${data.imageUrl || data.videoUrl || ''}" placeholder="https://..." />
            </label>
          </div>

          <div id="uploadPostProgress" class="hidden" style="margin-top:10px">
            <div class="progress-info">
              <span>Enviando mídia...</span>
              <strong id="uploadPostPercent">0%</strong>
            </div>
            <div class="progress"><div id="uploadPostBar" style="width:0%"></div></div>
          </div>

          <button class="primary-btn full" type="submit" id="submitPostBtn" style="margin-top:10px">
            ${id ? 'Salvar Alterações' : 'Publicar no BookTok'}
          </button>
        </form>
      `);

      $("#bookTokPostForm").onsubmit = async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const fileInput = $("#inpPostMediaFile");
        let mediaUrl = fd.get("mediaUrl");
        let isVideo = false;

        const submitBtn = $("#submitPostBtn");
        const progressContainer = $("#uploadPostProgress");
        const progressBar = $("#uploadPostBar");
        const progressPercent = $("#uploadPostPercent");

        if (fileInput && fileInput.files && fileInput.files[0]) {
          const file = fileInput.files[0];
          isVideo = file.type.startsWith("video/");
          submitBtn.disabled = true;
          submitBtn.textContent = "Enviando arquivo...";
          progressContainer.classList.remove("hidden");

          try {
            mediaUrl = await uploadToCloudinary(file, (percent) => {
              progressBar.style.width = percent + "%";
              progressPercent.textContent = percent + "%";
            });
          } catch(err) {
            console.error(err);
            toast("Erro ao enviar mídia para o Cloudinary.", "error");
            submitBtn.disabled = false;
            submitBtn.textContent = "Publicar no BookTok";
            progressContainer.classList.add("hidden");
            return;
          }
        } else if (mediaUrl) {
          isVideo = mediaUrl.endsWith(".mp4") || mediaUrl.endsWith(".webm") || mediaUrl.includes("video");
        }

        const payload = {
          title: fd.get("title"),
          description: fd.get("description"),
          userId: currentUser.uid,
          userName: currentProfile.name,
          updatedAt: new Date().toISOString()
        };

        if (isVideo) {
          payload.videoUrl = mediaUrl || "";
          payload.imageUrl = "";
        } else {
          payload.imageUrl = mediaUrl || "";
          payload.videoUrl = "";
        }

        try {
          if (id) {
            await db.collection("posts").doc(id).update(payload);
            toast("Resenha atualizada!", "success");
          } else {
            payload.likesCount = 0;
            payload.commentsCount = 0;
            payload.repostsCount = 0;
            payload.status = "active";
            payload.createdAt = new Date().toISOString();
            await db.collection("posts").add(payload);

            await db.collection("users").doc(currentUser.uid).update({
              xp: firebase.firestore.FieldValue.increment(20),
              cactoscoins: firebase.firestore.FieldValue.increment(5)
            });
            toast("Resenha publicada! Você ganhou +20 XP e +5 Cactoscoins!", "success");
          }
          closeModal();
          renderBookTok();
        } catch(err) {
          console.error(err);
          toast("Erro ao salvar publicação.", "error");
          submitBtn.disabled = false;
        }
      };
    }
    window.showBookTokPostModal = showBookTokPostModal;

    function editBookTokPost(id, encodedData) {
      showBookTokPostModal(id, encodedData);
    }
    window.editBookTokPost = editBookTokPost;

    async function deleteBookTokPost(id) {
      if (!confirm("Deseja apagar esta resenha?")) return;
      try {
        await db.collection("posts").doc(id).delete();
        toast("Resenha excluída.");
        renderBookTok();
      } catch(err) {
        console.error(err);
        toast("Erro ao excluir.", "error");
      }
    }
    window.deleteBookTokPost = deleteBookTokPost;

    async function repostBookTokPost(id, encodedData) {
      const original = JSON.parse(decodeURIComponent(encodedData));
      try {
        await db.collection("posts").add({
          title: original.title,
          description: original.description,
          imageUrl: original.imageUrl || "",
          videoUrl: original.videoUrl || "",
          userId: currentUser.uid,
          userName: currentProfile.name,
          isRepost: true,
          originalAuthor: original.userName,
          likesCount: 0,
          commentsCount: 0,
          repostsCount: 0,
          status: "active",
          createdAt: new Date().toISOString()
        });

        await db.collection("posts").doc(id).update({
          repostsCount: firebase.firestore.FieldValue.increment(1)
        });

        toast("Resenha repostada com sucesso no seu perfil!", "success");
        renderBookTok();
      } catch(err) {
        console.error(err);
        toast("Erro ao repostar.", "error");
      }
    }
    window.repostBookTokPost = repostBookTokPost;

    // --- PROFILE PAGE ---
    async function renderProfile() {
      const p = currentProfile;
      const isStu = p.role === "student";

      $("#pageContent").innerHTML = `
        ${pageTitle("Seu Perfil", "Gerencie suas informações e preferências do aplicativo.")}
        <div class="panel">
          <div class="flex" style="gap:20px;margin-bottom:20px">
            ${renderAvatar(p.photoURL, p.name)}
            <div>
              <h2>${p.name}</h2>
              <p class="muted">${roleLabel(p.role)} ${p.className ? `• ${p.className}` : ''}</p>
              <p style="font-size:13px;margin-top:4px">${p.email}</p>
            </div>
          </div>
          
          <div class="stats-grid" style="margin-bottom:20px">
            ${statCard(emoji('sol'), "XP Total", p.xp || 0)}
            ${statCard(emoji('cactocoin'), "Cactoscoins", p.cactoscoins || 0)}
            ${statCard(emoji('cordel'), "Livros Lidos", p.booksRead || 0)}
            ${statCard(emoji('chapeu'), "Nível", p.level || 1)}
          </div>

          <form id="profileEditForm" class="form-grid">
            <label>Nome Completo
              <input name="name" value="${p.name || ''}" required />
            </label>
            <label>Foto de Perfil (Enviar Imagem)
              <input type="file" id="inpProfilePhotoFile" accept="image/*" />
            </label>
            <button class="primary-btn full" type="submit" id="saveProfileBtn">Salvar Alterações</button>
          </form>
        </div>
      `;

      $("#profileEditForm").onsubmit = async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const name = fd.get("name");
        const photoFile = $("#inpProfilePhotoFile").files[0];
        const saveBtn = $("#saveProfileBtn");

        saveBtn.disabled = true;
        saveBtn.textContent = "Salvando...";

        try {
          let photoURL = p.photoURL || "";
          if (photoFile) {
            toast("Enviando foto de perfil...", "info");
            photoURL = await uploadToCloudinary(photoFile);
          }

          await db.collection("users").doc(currentUser.uid).update({
            name: name,
            photoURL: photoURL
          });

          currentProfile.name = name;
          currentProfile.photoURL = photoURL;

          toast("Perfil atualizado!", "success");
          renderProfile();
        } catch(err) {
          console.error(err);
          toast("Erro ao atualizar perfil.", "error");
          saveBtn.disabled = false;
          saveBtn.textContent = "Salvar Alterações";
        }
      };
    }

    // --- AUTHENTICATION FLOW ---
    auth.onAuthStateChanged(async (user) => {
      currentUser = user;
      if (user) {
        let userDoc = await db.collection("users").doc(user.uid).get();
        if (!userDoc.exists) {
          // Registro básico se não encontrado
          await db.collection("users").doc(user.uid).set({
            name: user.displayName || "Novo Usuário",
            email: user.email,
            role: "student",
            className: "5º Ano",
            xp: 0,
            cactoscoins: 0,
            booksRead: 0,
            createdAt: new Date().toISOString()
          });
          userDoc = await db.collection("users").doc(user.uid).get();
        }
        currentProfile = userDoc.data();
        currentTheme = currentProfile.activeTheme || localStorage.getItem("st-active-theme") || "default";
        renderApp();
      } else {
        currentProfile = null;
        renderAuth();
      }
    });

    function renderAuth() {
      applyThemeSettings();
      let isRegister = false;

      $("#app").innerHTML = `
        <div class="auth-layout">
          <div class="auth-hero">
            <div class="auth-hero-content">
              <h1>Sertão Literário</h1>
              <p>Plataforma pedagógica gamificada de incentivo à leitura sertaneja, cordéis e literatura escolar.</p>
            </div>
          </div>
          <div class="auth-panel">
            <div class="auth-card">
              <h2>Bem-vindo!</h2>
              <p>Acesse sua conta para entrar na biblioteca.</p>
              
              <div class="auth-tabs">
                <button id="tabLogin" class="active">Entrar</button>
                <button id="tabRegister">Cadastrar</button>
              </div>

              <form id="authForm" class="form-grid">
                <div id="registerFields" class="form-grid hidden">
                  <label>Nome Completo <input name="name" placeholder="Ex: Maria da Silva" /></label>
                  <label>Tipo de Conta
                    <select name="role" id="roleSelect">
                      <option value="student">Aluno</option>
                      <option value="teacher">Professor</option>
                      <option value="coordinator">Coordenador</option>
                    </select>
                  </label>
                  <div id="studentClassField">
                    <label>Sua Turma / Série
                      <select name="className">
                        ${TURMAS_DISPONIVEIS.map(t => `<option value="${t}">${t}</option>`).join("")}
                      </select>
                    </label>
                  </div>
                  <div id="staffCodeField" class="hidden">
                    <label>Código de Acesso de Servidor
                      <input name="staffCode" placeholder="Insira a chave recebida" />
                    </label>
                  </div>
                </div>

                <label>E-mail <input name="email" type="email" required placeholder="seu@email.com" /></label>
                <label>Senha <input name="password" type="password" required placeholder="••••••••" /></label>

                <button class="primary-btn full" type="submit" id="authSubmitBtn">Entrar no Sistema</button>
              </form>
            </div>
          </div>
        </div>
      `;

      const tabLogin = $("#tabLogin");
      const tabRegister = $("#tabRegister");
      const registerFields = $("#registerFields");
      const roleSelect = $("#roleSelect");
      const studentClassField = $("#studentClassField");
      const staffCodeField = $("#staffCodeField");
      const authSubmitBtn = $("#authSubmitBtn");

      tabLogin.onclick = () => {
        isRegister = false;
        tabLogin.classList.add("active");
        tabRegister.classList.remove("active");
        registerFields.classList.add("hidden");
        authSubmitBtn.textContent = "Entrar no Sistema";
      };

      tabRegister.onclick = () => {
        isRegister = true;
        tabRegister.classList.add("active");
        tabLogin.classList.remove("active");
        registerFields.classList.remove("hidden");
        authSubmitBtn.textContent = "Criar Minha Conta";
      };

      roleSelect.onchange = (e) => {
        if (e.target.value === "student") {
          studentClassField.classList.remove("hidden");
          staffCodeField.classList.add("hidden");
        } else {
          studentClassField.classList.add("hidden");
          staffCodeField.classList.remove("hidden");
        }
      };

      $("#authForm").onsubmit = async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const email = fd.get("email");
        const password = fd.get("password");

        try {
          if (isRegister) {
            const role = fd.get("role");
            const staffCode = fd.get("staffCode");

            if (role === "teacher" && staffCode !== PROFESSOR_CODE) {
              return toast("Código de Professor inválido!", "error");
            }
            if (role === "coordinator" && staffCode !== COORDINATOR_CODE) {
              return toast("Código de Coordenador inválido!", "error");
            }

            const cred = await auth.createUserWithEmailAndPassword(email, password);
            const userPayload = {
              name: fd.get("name"),
              email: email,
              role: role,
              xp: 0,
              cactoscoins: 0,
              booksRead: 0,
              createdAt: new Date().toISOString()
            };

            if (role === "student") {
              userPayload.className = fd.get("className");
            } else {
              userPayload.classes = TURMAS_DISPONIVEIS;
            }

            await db.collection("users").doc(cred.user.uid).set(userPayload);
            toast("Conta criada com sucesso!", "success");
          } else {
            await auth.signInWithEmailAndPassword(email, password);
            toast("Bem-vindo de volta!", "success");
          }
        } catch(err) {
          console.error(err);
          toast(err.message || "Erro na autenticação.", "error");
        }
      };
    }
  </script>
</body>
</html>
