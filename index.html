<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sertão Literário</title>
  
  <!-- Fonts: Special Elite (Cordel) e Bitter (Leitura) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,400;0,600;0,700;1,400&family=Special+Elite&display=swap" rel="stylesheet" />

  <!-- Firebase Compat Libraries -->
  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-storage-compat.js"></script>

  <!-- Chart.js para Gráficos Interativos -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- html2pdf.js para Exportação do Relatório em PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    /* =========================================================
       VARIÁVEIS E DEFINIÇÃO DOS TEMAS
       ========================================================= */
    
    /* 1. TEMA PADRÃO / MODERNO */
    :root, body[data-theme="default"] {
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --surface2: #F1F5F9;
      --text: #0F172A;
      --muted: #64748B;
      --border: #CBD5E1;
      --primary: #2563EB;
      --primary-dark: #1D4ED8;
      --green: #10B981;
      --cyan: #06B6D4;
      --danger: #EF4444;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      --radius: 8px;
      --font-title: 'Bitter', serif;
      --font-body: 'Bitter', serif;
    }

    body[data-theme="default"].dark {
      --bg: #0F172A;
      --surface: #1E293B;
      --surface2: #334155;
      --text: #F8FAFC;
      --muted: #94A3B8;
      --border: #334155;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
    }

    /* 2. TEMA CORDEL & XILOGRAVURA */
    body[data-theme="cordel"] {
      --bg: #F3E9DC;
      --surface: #EADBC8;
      --surface2: #DFCFB8;
      --text: #1A1817;
      --muted: #5C5248;
      --border: #1A1817;
      --primary: #C05C33;
      --primary-dark: #A04420;
      --green: #2D6A4F;
      --cyan: #E5A93C;
      --danger: #B23B23;
      --shadow: 4px 4px 0px #1A1817;
      --radius: 6px;
      --font-title: 'Special Elite', cursive, serif;
      --font-body: 'Bitter', serif;
    }

    body[data-theme="cordel"].dark {
      --bg: #1A1817;
      --surface: #2A2421;
      --surface2: #362E2A;
      --text: #F3E9DC;
      --muted: #B8A99A;
      --border: #F3E9DC;
      --shadow: 4px 4px 0px #F3E9DC;
    }

    /* 3. TEMA SERTÃO CYBERPUNK */
    body[data-theme="sertao-cyber"] {
      --bg: #090D16;
      --surface: #111827;
      --surface2: #1F2937;
      --text: #F3F4F6;
      --muted: #9CA3AF;
      --border: #06B6D4;
      --primary: #10B981;
      --primary-dark: #059669;
      --green: #10B981;
      --cyan: #06B6D4;
      --danger: #F43F5E;
      --shadow: 0 0 12px rgba(6, 182, 212, 0.3);
      --radius: 8px;
      --font-title: 'Special Elite', cursive, serif;
      --font-body: 'Bitter', serif;
    }

    /* 4. TEMA LUAR DO SERTÃO */
    body[data-theme="luar-sertao"] {
      --bg: #0B132B;
      --surface: #1C2541;
      --surface2: #2A365C;
      --text: #EDF2F4;
      --muted: #8D99AE;
      --border: #3A506B;
      --primary: #5BC0BE;
      --primary-dark: #3A9392;
      --green: #10B981;
      --cyan: #6FFFE9;
      --danger: #EF4444;
      --shadow: 0 4px 12px rgba(91, 192, 190, 0.25);
      --radius: 8px;
      --font-title: 'Bitter', serif;
      --font-body: 'Bitter', serif;
    }

    /* 5. TEMA FLOR DE CACTO */
    body[data-theme="caatinga-florida"] {
      --bg: #FDF0ED;
      --surface: #FFFFFF;
      --surface2: #F7D6D0;
      --text: #2D1A17;
      --muted: #8C5A52;
      --border: #E63946;
      --primary: #E63946;
      --primary-dark: #C1121F;
      --green: #2A9D8F;
      --cyan: #E9C46A;
      --danger: #D62828;
      --shadow: 3px 3px 0px #E63946;
      --radius: 10px;
      --font-title: 'Special Elite', cursive, serif;
      --font-body: 'Bitter', serif;
    }

    /* 6. TEMA SOL DOURADO */
    body[data-theme="sol-dourado"] {
      --bg: #FFFBEA;
      --surface: #FFF3C4;
      --surface2: #FFE89C;
      --text: #3D2600;
      --muted: #855B14;
      --border: #B45309;
      --primary: #D97706;
      --primary-dark: #B45309;
      --green: #059669;
      --cyan: #F59E0B;
      --danger: #DC2626;
      --shadow: 3px 3px 0px #B45309;
      --radius: 6px;
      --font-title: 'Bitter', serif;
      --font-body: 'Bitter', serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      transition: background .25s, color .25s;
    }

    /* Classe para Emojis PNG Personalizados */
    .emoji-custom {
      width: 1.25em;
      height: 1.25em;
      vertical-align: -0.2em;
      display: inline-block;
      object-fit: contain;
      user-select: none;
      pointer-events: none;
    }

    h1, h2, h3, h4, .brand, .page-title h1, .stat-value, .book-cover {
      font-family: var(--font-title) !important;
      letter-spacing: 0.5px;
    }

    button, input, select, textarea { font: inherit; }
    button { border: 0; cursor: pointer; }
    .hidden { display: none !important; }

    /* Toast Notifications */
    .toast {
      position: fixed; right: 22px; top: 22px; z-index: 50;
      max-width: 380px; padding: 16px 20px; border-radius: var(--radius);
      color: var(--bg); background: var(--text); border: 2px solid var(--border);
      box-shadow: var(--shadow); transform: translateY(-12px); opacity: 0; transition: .25s;
      font-weight: 600;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { background: var(--green); color: #fff; }
    .toast.error { background: var(--danger); color: #fff; }

    /* Auth Page */
    .auth-layout { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(380px, 0.9fr); }
    .auth-hero {
      position: relative; overflow: hidden; padding: 70px clamp(30px, 7vw, 110px);
      color: #F3E9DC;
      background: linear-gradient(135deg, rgba(26,24,23,0.92), rgba(192,92,51,0.85)),
                  url('https://down-br.img.susercontent.com/file/br-11134207-7r98o-lyjxah0w0gmd6a') center/cover;
      border-right: 3px solid var(--border);
    }
    .auth-hero-content { position: relative; z-index: 1; max-width: 620px; margin-top: 18vh; }
    .auth-hero-content h1 { font-size: clamp(42px, 5.5vw, 70px); line-height: 1.05; margin: 20px 0; text-shadow: 2px 2px 0px #1A1817; }
    .auth-hero-content p { max-width: 560px; color: rgba(243,233,220,0.9); font-size: 18px; line-height: 1.6; }

    .auth-panel { display: grid; place-items: center; padding: 30px; background: var(--bg); }
    .auth-card {
      width: min(100%, 470px); padding: 40px;
      border: 2px solid var(--border); border-radius: var(--radius);
      background: var(--surface); box-shadow: var(--shadow);
    }
    .auth-card h2 { font-size: 32px; margin-bottom: 8px; }
    .auth-card > p { color: var(--muted); margin-bottom: 28px; }

    .auth-tabs {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 5px; margin-bottom: 24px;
      border-radius: var(--radius); background: var(--surface2); border: 1px solid var(--border);
    }
    .auth-tabs button { padding: 12px; border-radius: 4px; color: var(--muted); background: transparent; font-weight: 700; }
    .auth-tabs button.active { color: var(--text); background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); }

    /* Form Components */
    .form-grid { display: grid; gap: 16px; }
    label { display: grid; gap: 7px; color: var(--text); font-size: 13px; font-weight: 700; text-transform: uppercase; }
    input, select, textarea {
      width: 100%; padding: 12px 14px; border: 2px solid var(--border); border-radius: var(--radius);
      outline: none; color: var(--text); background: var(--bg); transition: border .2s;
    }
    textarea { min-height: 90px; resize: vertical; }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); }

    .checkbox-group {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; padding: 10px;
      background: var(--surface2); border: 2px solid var(--border); border-radius: var(--radius);
    }
    .checkbox-item { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text); cursor: pointer; text-transform: none; }
    .checkbox-item input { width: auto; }

    .primary-btn, .secondary-btn, .danger-btn, .btn-editar {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 44px; padding: 10px 18px; border-radius: var(--radius); font-weight: 700;
      border: 2px solid var(--border); transition: transform .1s, box-shadow .1s;
      box-shadow: var(--shadow); text-transform: uppercase; font-size: 13px;
    }
    .primary-btn { color: #fff; background: var(--primary); }
    .secondary-btn, .btn-editar { color: var(--text); background: var(--surface2); }
    .danger-btn { color: white; background: var(--danger); }
    .primary-btn:hover, .secondary-btn:hover, .danger-btn:hover, .btn-editar:hover { transform: translate(-2px, -2px); }
    .primary-btn:active, .secondary-btn:active, .danger-btn:active, .btn-editar:active { transform: translate(1px, 1px); }
    .full { width: 100%; }

    /* Main App Layout */
    .app-shell { min-height: 100vh; padding-bottom: 92px; }
    .topbar {
      position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between;
      gap: 18px; padding: 16px clamp(18px, 5vw, 70px);
      border-bottom: 2px solid var(--border);
      background: var(--surface);
    }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 26px; font-weight: 800; cursor: pointer; }
    .brand-mark {
      width: 44px; height: 44px; display: grid; place-items: center; border-radius: var(--radius);
      background: var(--primary); color: #fff; font-size: 24px; border: 2px solid var(--border);
      box-shadow: var(--shadow); overflow: hidden;
    }
    .brand-mark img { width: 100%; height: 100%; object-fit: cover; }
    
    .top-actions { display: flex; align-items: center; gap: 10px; }
    .icon-btn { width: 42px; height: 42px; display: grid; place-items: center; border: 2px solid var(--border); border-radius: var(--radius); color: var(--text); background: var(--surface2); box-shadow: var(--shadow); font-weight: bold; }
    .user-pill { display: flex; align-items: center; gap: 10px; padding: 4px 14px 4px 4px; border: 2px solid var(--border); border-radius: var(--radius); background: var(--surface2); font-weight: 600; }
    
    .avatar {
      width: 34px; height: 34px; border-radius: var(--radius);
      background: var(--primary); border: 2px solid var(--border);
      color: white; font-weight: 800; font-size: 14px;
      display: grid; place-items: center; overflow: hidden; flex-shrink: 0;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }

    .page { width: min(1400px, 100%); margin: 0 auto; padding: 34px clamp(18px, 5vw, 70px); }
    .page-title { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 28px; }
    .page-title h1 { font-size: clamp(34px, 4.5vw, 48px); line-height: 1; }
    .page-title p { margin-top: 7px; color: var(--muted); }

    /* Dashboard Widgets */
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .stat-card {
      position: relative; overflow: hidden; padding: 20px; border: 2px solid var(--border);
      border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow);
    }
    .stat-label { color: var(--muted); font-size: 12px; font-weight: 700; text-transform: uppercase; }
    .stat-value { font-size: 34px; line-height: 1; margin-top: 7px; color: var(--primary); display: flex; align-items: center; gap: 6px; }
    .stat-icon { margin-bottom: 8px; font-size: 26px; }

    .panel { border: 2px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); padding: 24px; }
    .panel-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
    .panel-header h2 { font-size: 24px; }
    .content-grid { display: grid; grid-template-columns: 1.35fr 0.65fr; gap: 18px; margin-top: 18px; }

    .progress-list { display: grid; gap: 18px; }
    .progress-info { display: flex; justify-content: space-between; margin-bottom: 7px; font-size: 13px; font-weight: 600; }
    .progress { height: 12px; border-radius: var(--radius); background: var(--bg); border: 2px solid var(--border); overflow: hidden; }
    .progress > div { height: 100%; background: var(--primary); }

    .ranking { display: grid; gap: 10px; }
    .ranking-item { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: var(--radius); border: 2px solid var(--border); background: var(--bg); cursor: pointer; transition: transform .15s; }
    .ranking-item:hover { transform: translateX(4px); }
    .ranking-pos { width: 26px; color: var(--primary); font-weight: 800; text-align: center; font-family: var(--font-title); }
    .ranking-name { flex: 1; font-weight: 600; }
    .xp-badge { padding: 4px 8px; border-radius: 4px; border: 1px solid var(--border); color: var(--text); background: var(--cyan); font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }

    /* Book Cards & Styles */
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
    .book-card, .card-livro, .post-card, .campaign-card {
      overflow: hidden; border: 2px solid var(--border); border-radius: var(--radius);
      background: var(--surface); box-shadow: var(--shadow); display: flex; flex-direction: column;
    }
    .book-cover { height: 190px; display: grid; place-items: center; background: var(--surface2); color: var(--text); border-bottom: 2px solid var(--border); font-size: 32px; overflow: hidden; position: relative; }
    .book-cover img { width: 100%; height: 100%; object-fit: cover; }
    .book-content, .post-content, .campaign-content { padding: 18px; flex: 1; display: flex; flex-direction: column; }
    .book-content h3, .campaign-content h3, .card-livro .titulo { margin-bottom: 4px; font-size: 20px; }
    .book-content p.autor, .card-livro .autor { color: var(--muted); font-size: 13px; font-weight: 600; margin-bottom: 8px; }
    
    .card-livro .resumo {
      color: var(--text); font-size: 12px; line-height: 1.5; font-style: italic;
      margin: 8px 0 12px 0; flex: 1; display: -webkit-box; -webkit-line-clamp: 3;
      -webkit-box-orient: vertical; overflow: hidden; background: var(--bg);
      padding: 8px 10px; border-radius: var(--radius); border: 1px solid var(--border);
      border-left: 4px solid var(--primary);
    }

    .book-meta, .card-livro .acoes { display: flex; align-items: center; justify-content: space-between; margin-top: auto; gap: 8px; flex-wrap: wrap; }

    .tag, .status {
      display: inline-flex; padding: 4px 8px; border-radius: 4px; border: 1px solid var(--border);
      color: var(--text); background: var(--cyan); font-size: 11px; font-weight: 700; margin-bottom: 6px; align-self: flex-start; text-transform: uppercase; align-items: center; gap: 4px;
    }

    .post-video { height: 260px; display: grid; place-items: center; background: #000; border-bottom: 2px solid var(--border); color: #fff; overflow: hidden; position: relative; }
    .post-video video { width: 100%; height: 100%; object-fit: cover; }
    .post-actions { display: flex; gap: 12px; margin-top: 14px; }
    .post-actions button { padding: 6px 12px; border-radius: var(--radius); border: 2px solid var(--border); color: var(--text); background: var(--bg); font-weight: 700; }

    .student-card {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 14px 18px; border: 2px solid var(--border); border-radius: var(--radius); background: var(--surface2);
      cursor: pointer; transition: transform .15s, box-shadow .15s;
    }
    .student-card:hover { transform: translate(-2px, -2px); box-shadow: var(--shadow); }

    .tab-pills { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 16px; }
    .tab-pill { padding: 8px 16px; border-radius: var(--radius); background: var(--bg); border: 2px solid var(--border); font-weight: 700; font-size: 13px; color: var(--text); cursor: pointer; white-space: nowrap; }
    .tab-pill.active { background: var(--primary); color: white; box-shadow: var(--shadow); }

    .empty-state { padding: 40px 20px; color: var(--muted); text-align: center; font-style: italic; }

    /* Modal */
    .modal {
      position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 20px;
      background: rgba(0,0,0,0.65); backdrop-filter: blur(4px);
    }
    .modal-card { width: min(100%, 680px); max-height: calc(100vh - 40px); overflow-y: auto; padding: 28px; border: 3px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
    .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
    .modal-header h2 { font-size: 28px; }

    /* Bottom Navigation Bar */
    .bottom-nav {
      position: fixed; left: 50%; bottom: 16px; z-index: 20;
      width: min(720px, calc(100% - 28px));
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 6px;
      border: 2px solid var(--border); border-radius: var(--radius);
      background: var(--surface); box-shadow: var(--shadow);
      transform: translateX(-50%);
    }
    .nav-btn { display: grid; justify-items: center; gap: 3px; padding: 8px 4px; border-radius: 4px; color: var(--muted); background: transparent; font-size: 11px; font-weight: 700; }
    .nav-btn span:first-child { font-size: 20px; display: inline-flex; justify-content: center; align-items: center; }
    .nav-btn.active { color: var(--text); background: var(--cyan); border: 1px solid var(--border); box-shadow: var(--shadow); }

    /* ESTILOS DO MÓDULO DE RELATÓRIOS E ANALYTICS */
    .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
    .chart-card { background: var(--surface); border: 2px solid var(--border); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); position: relative; }
    .chart-container { position: relative; width: 100%; height: 280px; }
    
    .presentation-active {
      position: fixed !important; inset: 0 !important; z-index: 9999 !important;
      background: var(--bg) !important; padding: 40px !important; overflow-y: auto !important;
    }

    .highlight-box {
      background: var(--surface2); border: 2px dashed var(--primary);
      border-radius: var(--radius); padding: 20px; margin-bottom: 24px;
      display: flex; align-items: center; gap: 16px;
    }

    .section-space { margin-top: 28px; }
    .muted { color: var(--muted); }
    .flex { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; gap: 12px; }

    @media (max-width: 1050px) {
      .auth-layout { grid-template-columns: 1fr; }
      .auth-hero { min-height: 280px; }
      .auth-hero-content { margin-top: 20px; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .content-grid, .chart-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 720px) {
      .auth-hero { min-height: 220px; padding: 24px 18px; }
      .auth-hero-content h1 { font-size: 34px; }
      .auth-panel { padding: 18px; }
      .auth-card { padding: 20px; }
      .topbar { padding: 14px 18px; }
      .page { padding: 20px 16px 100px; }
      .page-title { flex-direction: column; align-items: flex-start; }
      .stats-grid, .cards-grid { grid-template-columns: 1fr; }
      .bottom-nav { bottom: 10px; }
    }
  </style>
</head>
<body>

  <div id="app"></div>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="modalTitle">Título</h2>
        <button id="closeModalBtn" class="icon-btn">×</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    // --- FIREBASE CONFIGURATION ---
    const firebaseConfig = {
      apiKey: "AIzaSyA-xVOI6qXkEndKXkSp6-zRLY01qNkQH4E",
      authDomain: "sertao-literario-booktok.firebaseapp.com",
      projectId: "sertao-literario-booktok",
      storageBucket: "sertao-literario-booktok.firebasestorage.app",
      messagingSenderId: "291651799720",
      appId: "1:291651799720:web:b5c79954511f09b8ddd09d"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const storage = firebase.storage();

    const PROFESSOR_CODE = "SERTAO-PROF-2026";
    const COORDINATOR_CODE = "SERTAO-COORD-2026";
    const TURMAS_DISPONIVEIS = ["5º Ano", "6º Ano", "7º Ano", "8º Ano", "9º Ano"];

    // ========================================================
    // --- HELPER DE EMOJIS PERSONALIZADOS (PNG) ---
    // ========================================================

    function toast(msg, type = "") {
      const t = $("#toast");
      t.textContent = msg;
      t.className = "toast show " + type;
      setTimeout(() => { t.className = "toast"; }, 3500);
    }

    function initials(name) {
      return (name || "SL").split(" ").slice(0, 2).map(w => w[0]).join("").toUpperCase();

    function roleLabel(r) {
      const map = { student: "Aluno", teacher: "Professor", coordinator: "Coordenador" };

    function openModal(title, body) {
      $("#modalTitle").textContent = title;

      $("#modal").classList.add("hidden");

      return `<div class="page-title"><div><h1>${title}</h1><p>${desc}</p></div>${extra}</div>`;

      return `<div class="stat-card"><div class="stat-icon">${icon}</div><div class="stat-label">${label}</div><div class="stat-value">${value}</div></div>`;

    }

    function fileToDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = e => resolve(e.target.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function loadReportData() {
      const container = $("#reportContentArea");
      if (!container) return;

      try {
        const studentsSnap = await db.collection("users")
          .where("role", "==", "student")
          .where("className", "==", selectedTeacherClass)
          .get();

        const students = [];
        studentsSnap.forEach(d => students.push({ id: d.id, ...d.data() }));

        const totalAlunos = students.length;
        let totalLivrosLidos = 0;
        let totalPaginasLidas = 0;
        let alunosAtivos = 0;

        students.forEach(s => {
          const books = s.booksRead || 0;
          totalLivrosLidos += books;
          if (books > 0) alunosAtivos++;
        });

        const studentIds = students.map(s => s.id);
        let categoryMap = { "Literatura Sertaneja": 0, "Poesia & Cordel": 0, "Ficção": 0, "Outros": 0 };
        let monthlyData = [5, 12, 18, 25, 30, totalLivrosLidos > 30 ? totalLivrosLidos : 35];

        if (studentIds.length > 0) {
          const readingsSnap = await db.collection("readings").get();
          readingsSnap.forEach(doc => {
            const r = doc.data();
            if (studentIds.includes(r.userId)) {
              totalPaginasLidas += (r.pagesRead || 0);
            }
          });
        }

        const taxaEngajamento = totalAlunos > 0 ? Math.round((alunosAtivos / totalAlunos) * 100) : 0;
        const mediaLivros = totalAlunos > 0 ? (totalLivrosLidos / totalAlunos).toFixed(1) : 0;

        container.innerHTML = `
          <div class="highlight-box" style="background:var(--surface);border-style:solid">
            <span style="font-size:42px">${emoji('chapeu')}</span>
            <div>
              <h3 style="margin-bottom:4px">Destaque de Desempenho (${selectedTeacherClass})</h3>
              <p style="font-size:14px;color:var(--text)">
                A turma registrou um total de <strong>${totalLivrosLidos} livros lidos</strong> neste período, com uma taxa de engajamento leitor de <strong>${taxaEngajamento}%</strong>!
              </p>
            </div>
          </div>

          <div class="stats-grid">
            ${statCard(emoji('cordel'), "Total de Livros Lidos", totalLivrosLidos)}
            ${statCard("📄", "Páginas Lidas", totalPaginasLidas)}
            ${statCard("🔥", "Engajamento da Turma", taxaEngajamento + "%")}
            ${statCard("📊", "Média por Aluno", mediaLivros)}
          </div>

          <div class="chart-grid">
            <div class="chart-card">

    function renderCharts(monthlyData, categoryMap) {
      const primaryColor = getComputedStyle(document.body).getPropertyValue('--primary').trim() || '#2563EB';
      const cyanColor = getComputedStyle(document.body).getPropertyValue('--cyan').trim() || '#06B6D4';
      const greenColor = getComputedStyle(document.body).getPropertyValue('--green').trim() || '#10B981';

      if (chartEvolucaoInstance) chartEvolucaoInstance.destroy();
      if (chartCategoriasInstance) chartCategoriasInstance.destroy();

      const ctx1 = document.getElementById('chartEvolucao');
      if (ctx1) {
        chartEvolucaoInstance = new Chart(ctx1, {
          type: 'line',
          data: {
            labels: ['Mês 1', 'Mês 2', 'Mês 3', 'Mês 4', 'Mês 5', 'Atual'],
            datasets: [{
              label: 'Livros Lidos Acumulados',
              data: monthlyData,
              borderColor: primaryColor,
              backgroundColor: primaryColor + '22',
              fill: true,
              tension: 0.3,
              borderWidth: 3
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } }
          }
        });
      }

      const ctx2 = document.getElementById('chartCategorias');
      if (ctx2) {
        chartCategoriasInstance = new Chart(ctx2, {
          type: 'doughnut',
          data: {
            labels: ['Cordel & Sertão', 'Poesia', 'Contos & Ficção', 'Outros'],
            datasets: [{
              data: [45, 25, 20, 10],
              backgroundColor: [primaryColor, cyanColor, greenColor, '#F59E0B']
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false
          }
        });
      }
    }

          if (b.isActive !== false) books.push({ id: d.id, ...b });
        });
        books.sort((a,b) => (a.title || "").localeCompare(b.title || ""));
      } catch(e) { console.error(e); }

      const isStaff = currentProfile.role !== "student";
      let booksHtml = books.length ? "" : '<div class="empty-state">Nenhum livro cadastrado na biblioteca.</div>';

      for (let b of books) {
        const coverStyle = b.coverUrl ? `<img src="${b.coverUrl}" alt="Capa" />` : emoji('cordel');

        booksHtml += `
          <div class="card-livro book-card" data-id="${b.id}">
            <div class="book-cover">${coverStyle}</div>
            <div class="book-content">
              <span class="status">${b.status || "Disponível"}</span>

                <button class="btn-editar" style="font-size:11px;padding:6px 10px" onclick="abrirModalEdicao('${b.id}')">✏️ Editar</button>
                ${isStaff ? `<button class="danger-btn" style="font-size:11px;padding:6px 10px" data-del="${b.id}">Excluir</button>` : ''}
                ${!isStaff ? `<button class="primary-btn" style="font-size:11px;padding:6px 10px" data-read="${b.title.replace(/"/g,"&quot;")}">Registrar Leitura</button>` : ''}
              </div>
            </div>
          </div>`;
      }

      $("#pageContent").innerHTML =
        pageTitle("Biblioteca Sertaneja", isStaff ? "Cadastre e gerencie o acervo da escola." : "Escolha sua leitura e registre seu progresso.", isStaff ? '<button class="primary-btn" id="addBookBtn">+ Cadastrar Livro</button>' : "") +

          openModal("Cadastrar Novo Livro", `

              <label>Título <input name="title" required /></label>
              <label>Autor <input name="author" required /></label>
              <label>Páginas <input name="pages" type="number" min="1" required /></label>
              <label>Categoria <input name="category" value="Literatura Sertaneja" /></label>
              <label>Resumo / Sinopse <textarea name="summary" placeholder="Escreva um breve resumo..."></textarea></label>
              <label>Capa - Escolher Imagem <input type="file" id="inpCoverFile" accept="image/*" /></label>
              <label>Ou Link/URL da Capa <input name="coverUrl" id="inpCoverUrl" placeholder="https://..." /></label>

          $("#bookForm").onsubmit = async (e) => {

                    isTheme ? (
                      isCurrentThemeActive ? `<span class="tag" style="background:var(--green);color:#fff">Equipado</span>` :
                      isThemeUnlocked ? `<button class="secondary-btn" style="font-size:11px;padding:6px 12px" onclick="equipTheme('${it.themeId}')">Equipar</button>` :
                      `<button class="primary-btn" style="font-size:11px;padding:6px 12px" onclick="buyTheme('${it.themeId}', ${it.priceCoins}, ${it.requiredXp})">Desbloquear</button>`
                    ) : `<button class="primary-btn" style="font-size:11px;padding:6px 12px" onclick="buyReward('${it.id || ''}', ${it.priceCoins}, ${it.requiredXp})">Resgatar</button>`
                  ) : ''}
                  ${isStaff && !isTheme ? `
                    <button class="btn-editar" style="font-size:11px;padding:6px 10px" onclick="showStoreItemModal('${it.id}', '${encodedData}')">✏️ Editar</button>
                    ${it.id && !it.id.startsWith('default_') ? `<button class="danger-btn" style="font-size:11px;padding:6px 10px" onclick="deleteStoreItem('${it.id}')">🗑️</button>` : ''}
                  ` : ''}
                </div>
              </div>
            </div>
          </article>`;
      }).join("");

      $("#pageContent").innerHTML =
        pageTitle(
          "Loja Literária", 
          isStu ? "Troque suas Cactoscoins por recompensas e novos temas!" : "Gerencie os itens, preços e temas da loja.",
          isStaff ? '<button class="primary-btn" id="newStoreItemBtn">+ Novo Item</button>' : ''
        ) +
        `<div class="stats-grid" style="margin-bottom:18px">
          ${statCard(emoji('cactocoin'),"Seu Saldo", coins)}
          ${statCard(emoji('sol'),"Seu XP", xp)}
        </div>
        <div class="cards-grid">${itemsHtml}</div>`;

      if (isStaff && $("#newStoreItemBtn")) {
        $("#newStoreItemBtn").onclick = () => showStoreItemModal();
      }
    }

    function showStoreItemModal(id = null, dataJson = null) {
      const data = dataJson ? JSON.parse(decodeURIComponent(dataJson)) : {};
      openModal(id && !id.startsWith('default_') ? "✏️ Editar Item da Loja" : "🎁 Novo Item da Loja", `
        <form id="storeItemForm" class="form-grid">
          <label>Título do Item <input name="title" value="${data.title || ''}" required placeholder="Ex: Ponto Extra na Prova" /></label>
          <label>Descrição <textarea name="description" required placeholder="Ex: Garanta meio ponto na próxima nota bimestral...">${data.description || ''}</textarea></label>
          <label>Preço em Cactoscoins <input name="priceCoins" type="number" min="0" value="${data.priceCoins || 50}" required /></label>
          <label>XP Mínimo Requerido <input name="requiredXp" type="number" min="0" value="${data.requiredXp || 0}" required /></label>
          <label>Ícone ou Emoji <input name="icon" value="${data.icon || '🎁'}" placeholder="Ex: 🔖, 🏅, 📝, 🎟️" required /></label>
          <button class="primary-btn full" type="submit">${id && !id.startsWith('default_') ? 'Salvar Alterações' : 'Adicionar à Loja'}</button>
        </form>`);

      document.getElementById("storeItemForm").onsubmit = async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const payload = {
          title: fd.get("title"),
          description: fd.get("description"),
          priceCoins: Number(fd.get("priceCoins")),
          requiredXp: Number(fd.get("requiredXp")),
          icon: fd.get("icon"),
          isActive: true
        };

        try {
          if (id && !id.startsWith('default_')) {
            await db.collection("storeItems").doc(id).update(payload);
            toast("Item atualizado na loja!", "success");
          } else {
            payload.createdAt = new Date().toISOString();
            await db.collection("storeItems").add(payload);
            toast("Novo item adicionado à loja!", "success");
          }
          closeModal();
          renderStore();
        } catch(err) {
          console.error(err);
          toast("Erro ao salvar item na loja.", "error");
        }
      };
    }
    window.showStoreItemModal = showStoreItemModal;

    async function deleteStoreItem(id) {
      if (!id || id.startsWith('default_')) return;
      if (confirm("Deseja realmente remover este item da loja?")) {
        try {
          await db.collection("storeItems").doc(id).delete();
          toast("Item removido da loja.");
          renderStore();
        } catch(err) {
          console.error(err);
          toast("Erro ao remover o item.", "error");
        }
      }
    }
    window.deleteStoreItem = deleteStoreItem;

    async function buyTheme(themeId, priceCoins, requiredXp) {
      const p = currentProfile;
      if ((p.cactoscoins || 0) < priceCoins) return toast("Cactoscoins insuficientes!", "error");
      if ((p.xp || 0) < requiredXp) return toast(`Requer pelo menos ${requiredXp} XP!`, "error");

      const unlocked = p.unlockedThemes || ["default"];
      if (!unlocked.includes(themeId)) unlocked.push(themeId);

      const newCoins = (p.cactoscoins || 0) - priceCoins;

      await db.collection("users").doc(currentUser.uid).update({
        cactoscoins: newCoins,
        unlockedThemes: unlocked
      });

      currentProfile.cactoscoins = newCoins;
      currentProfile.unlockedThemes = unlocked;

      toast("Tema desbloqueado com sucesso!", "success");
      equipTheme(themeId);
    }
    window.buyTheme = buyTheme;

    async function buyReward(itemId, priceCoins, requiredXp) {
      const p = currentProfile;
      if ((p.cactoscoins || 0) < priceCoins) return toast("Cactoscoins insuficientes!", "error");
      if ((p.xp || 0) < requiredXp) return toast(`Requer pelo menos ${requiredXp} XP!`, "error");

      if (!confirm(`Deseja resgatar esta recompensa por ${priceCoins} Cactoscoins?`)) return;

      const newCoins = (p.cactoscoins || 0) - priceCoins;

      try {
        await db.collection("users").doc(currentUser.uid).update({
          cactoscoins: newCoins
        });

        currentProfile.cactoscoins = newCoins;
        toast("Recompensa resgatada! Apresente ao professor na escola.", "success");
        renderStore();
      } catch(err) {
        console.error(err);
        toast("Erro ao processar resgate.", "error");
      }
    }
    window.buyReward = buyReward;

    // =========================================================
    // --- 📹 BOOKTOK PAGE (COM SUPORTE A GALERIA E CÂMERA) ---
    // =========================================================
    async function renderBookTok() {
      let posts = [];
      try {
        const snap = await db.collection("posts").where("status","==","active").get();
        snap.forEach(d => posts.push({ id: d.id, ...d.data() }));
        posts.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
      } catch(e) { console.error(e); }

      let postsHtml = posts.length ? "" : '<div class="empty-state">Nenhum vídeo publicado ainda. Seja o primeiro a gravar uma resenha!</div>';
      
      for (let p of posts) {
        let videoMedia = emoji('booktok');
        
        if (p.videoUrl) {
          videoMedia = `<video src="${p.videoUrl}" controls playsinline preload="metadata" style="width:100%; height:100%; object-fit:cover;"></video>`;
        }

        postsHtml += `
          <article class="post-card">
            <div class="post-video">${videoMedia}</div>
            <div class="post-content">
              <span class="tag">@${(p.userName || "usuario").toLowerCase().replace(/\s/g,"")}</span>
              <h3>${p.title}</h3>
              <p>${p.description || ""}</p>
              <div class="post-actions">
                <button class="like-btn" data-id="${p.id}">❤️ ${p.likesCount || 0}</button>
                <button>💬 ${p.commentsCount || 0}</button>
              </div>
            </div>
          </article>`;
      }

      $("#pageContent").innerHTML =
        pageTitle(`BookTok Sertanejo ${emoji('booktok')}`, "Grave da câmera ou escolha da galeria para compartilhar suas resenhas literárias em vídeo.", '<button class="primary-btn" id="newPostBtn">+ Nova Resenha</button>') +
        `<div class="cards-grid">${postsHtml}</div>`;

      $("#newPostBtn").onclick = () => {
        openModal("Publicar Resenha no BookTok", `
          <form id="postForm" class="form-grid">
            <label>Título do Vídeo <input name="title" required placeholder="Ex: Resenha de O Quinze" /></label>
            <label>Descrição <textarea name="description" required placeholder="Conte um pouco sobre o que achou do livro..."></textarea></label>
            
            <label>📹 Gravar da Câmera ou Escolher da Galeria:
              <input type="file" id="inpVideoFile" accept="video/*" capture="environment" style="padding: 8px;" />
            </label>
            
            <label>Ou Link/URL Direta de Vídeo (Opcional):
              <input name="videoUrl" type="url" placeholder="https://..." />
            </label>
            
            <button class="primary-btn full" type="submit" id="submitPostBtn">Publicar Vídeo</button>
          </form>`);

        $("#postForm").onsubmit = async (e) => {
          e.preventDefault();
          const fd = new FormData(e.target);
          const videoFile = $("#inpVideoFile").files[0];
          let videoUrl = fd.get("videoUrl");
          const submitBtn = $("#submitPostBtn");

          if (!videoFile && !videoUrl) {
            return toast("Por favor, selecione um arquivo de vídeo ou insira um link.", "error");
          }

          try {
            submitBtn.disabled = true;
            submitBtn.textContent = "Enviando vídeo...";

            if (videoFile) {
              toast("Enviando seu vídeo... aguarde!", "success");
              const storageRef = storage.ref(`booktok_videos/${Date.now()}_${videoFile.name}`);
              const snapshot = await storageRef.put(videoFile);
              videoUrl = await snapshot.ref.getDownloadURL();
            }

            await db.collection("posts").add({
              title: fd.get("title"), 
              description: fd.get("description"),
              videoUrl: videoUrl || "", 
              userId: currentUser.uid,
              userName: currentProfile.name, 
              likesCount: 0, 
              commentsCount: 0, 
              status: "active",
              createdAt: new Date().toISOString()
            });

            closeModal();
            toast("Resenha em vídeo publicada com sucesso!", "success");
            renderBookTok();
          } catch(err) {
            console.error(err);
            toast("Erro ao enviar o vídeo. Tente novamente.", "error");
            submitBtn.disabled = false;
            submitBtn.textContent = "Publicar Vídeo";
          }
        };
      };

      $$(".like-btn").forEach(btn => {
        btn.onclick = async function() {
          await db.collection("posts").doc(this.dataset.id).update({
            likesCount: firebase.firestore.FieldValue.increment(1)
          });
          toast("Você curtiu a resenha!");
          renderBookTok();
        };
      });
    }

    // --- PROFILE ---
    function renderProfile() {
      const p = currentProfile;
      const turmasTexto = Array.isArray(p.classes) ? p.classes.join(", ") : (p.className || "Não definida");

      $("#pageContent").innerHTML =
        pageTitle("Meu Perfil", "Gerencie suas informações pessoais.", `<span class="tag" style="font-size:14px">${roleLabel(p.role)}</span>`) +
        `<div class="content-grid">
          <div class="panel">
            <h2 style="margin-bottom:20px">Informações Pessoais</h2>
            <div class="form-grid">
              <label>Nome Completo <input id="editName" value="${p.name || ""}" /></label>
              <label>E-mail <input value="${p.email || ""}" disabled /></label>
              <label>URL da Foto de Perfil <input id="editPhoto" value="${p.photoURL || ""}" placeholder="https://..." /></label>
              <label>Foto de Perfil do Dispositivo <input type="file" id="editPhotoFile" accept="image/*" /></label>
              <label>Turma(s) Vinculada(s) <input value="${turmasTexto}" disabled /></label>
              <button id="saveBtn" class="primary-btn full">Salvar Alterações</button>
            </div>
          </div>
          <div class="panel">
            <h2 style="margin-bottom:20px">Sua Conquista</h2>
            <div class="progress-list">
              <div class="ranking-item"><span>${emoji('cordel')}</span><span class="ranking-name">Livros Lidos</span><strong>${p.booksRead || 0}</strong></div>
              <div class="ranking-item"><span>${emoji('sol')}</span><span class="ranking-name">Experiência (XP)</span><strong>${p.xp || 0}</strong></div>
              <div class="ranking-item"><span>${emoji('chapeu')}</span><span class="ranking-name">Nível Atual</span><strong>${p.level || 1}</strong></div>
              <div class="ranking-item"><span>${emoji('cactocoin')}</span><span class="ranking-name">Cactoscoins</span><strong>${p.cactoscoins || 0}</strong></div>
            </div>
          </div>
        </div>`;

      $("#saveBtn").onclick = async () => {
        const name = $("#editName").value.trim();
        let photoURL = $("#editPhoto").value.trim();
        const fileInput = $("#editPhotoFile");

        if (!name) return toast("Informe seu nome.", "error");

        if (fileInput && fileInput.files && fileInput.files[0]) {
          try { photoURL = await fileToDataUrl(fileInput.files[0]); } catch(e) { console.error(e); }
        }

        await db.collection("users").doc(currentUser.uid).update({ name, photoURL });
        currentProfile.name = name;
        currentProfile.photoURL = photoURL;
        toast("Perfil atualizado!", "success");
        renderApp();
      };
    }

    // --- AUTH ---
    let isRegister = false;

    function renderAuth() {
      applyThemeSettings();
      const turmasOptions = TURMAS_DISPONIVEIS.map(t => `<option value="${t}">${t}</option>`).join("");
      const turmasCheckboxes = TURMAS_DISPONIVEIS.map(t => `
        <label class="checkbox-item"><input type="checkbox" name="teacherClasses" value="${t}" /> ${t}</label>
      `).join("");

      $("#app").innerHTML = `
        <div class="auth-layout">
          <div class="auth-hero">
            <div class="brand"><div class="brand-mark">${emoji('brotinho')}</div><span>Sertão Literário</span></div>
            <div class="auth-hero-content">
              <h1>A leitura virou jornada.</h1>
              <p>Uma experiência literária gamificada do 5º ao 9º ano. Leia, conquiste e ganhe novos temas visuais!</p>
            </div>
          </div>
          <div class="auth-panel">
            <div class="auth-card">
              <h2 id="authTitle">Entrar na jornada</h2>
              <p id="authDesc">Acesse seu painel literário.</p>
              <div class="auth-tabs">
                <button id="tabLogin" class="active">Entrar</button>
                <button id="tabReg">Criar conta</button>
              </div>
              <form id="authForm" class="form-grid">
                <div id="nameField" class="hidden"><label>Nome Completo <input id="inpName" type="text" /></label></div>
                <label>E-mail <input id="inpEmail" type="email" required /></label>
                
                <div id="roleField" class="hidden">
                  <label>Perfil <select id="inpRole">
                    <option value="student">Aluno</option>
                    <option value="teacher">Professor</option>
                    <option value="coordinator">Coordenador</option>
                  </select></label>
                </div>

                <div id="studentClassField" class="hidden">
                  <label>Selecione sua Turma <select id="inpStudentClass">${turmasOptions}</select></label>
                </div>

                <div id="teacherClassField" class="hidden">
                  <label>Selecione as Turmas que leciona</label>
                  <div class="checkbox-group">${turmasCheckboxes}</div>
                </div>

                <div id="photoField" class="hidden">
                  <label>URL da Foto de Perfil <input id="inpPhoto" type="url" placeholder="https://..." /></label>
                  <label style="margin-top:6px">Ou Escolher da Galeria <input type="file" id="inpPhotoFile" accept="image/*" /></label>
                </div>

                <div id="codeField" class="hidden"><label>Código de Acesso Institucional <input id="inpCode" type="password" /></label></div>
                
                <div>
                  <label>Senha <input id="inpPwd" type="password" minlength="6" required /></label>
                  <div id="forgotPwdWrapper" style="text-align: right; margin-top: 6px;">
                    <a href="#" id="forgotPwdBtn" style="font-size: 12px; color: var(--primary); font-weight: 700; text-decoration: underline;">Esqueceu a senha?</a>
                  </div>
                </div>

                <button class="primary-btn full" type="submit" id="authBtn">Entrar</button>
              </form>
            </div>
          </div>
        </div>`;

      $("#tabLogin").onclick = () => setMode(false);
      $("#tabReg").onclick = () => setMode(true);
      
      $("#inpRole").onchange = function() {
        const role = this.value;
        $("#studentClassField").classList.toggle("hidden", role !== "student" || !isRegister);
        $("#teacherClassField").classList.toggle("hidden", role !== "teacher" || !isRegister);
        $("#codeField").classList.toggle("hidden", role === "student" || !isRegister);
      };

      $("#forgotPwdBtn").onclick = (e) => {
        e.preventDefault();
        openForgotPasswordModal();
      };

      $("#authForm").onsubmit = handleAuth;
      setMode(false);
    }

    function setMode(reg) {
      isRegister = reg;
      $("#tabLogin").classList.toggle("active", !reg);
      $("#tabReg").classList.toggle("active", reg);
      $("#nameField").classList.toggle("hidden", !reg);
      $("#roleField").classList.toggle("hidden", !reg);
      $("#photoField").classList.toggle("hidden", !reg);
      $("#forgotPwdWrapper").classList.toggle("hidden", reg);

      const role = $("#inpRole") ? $("#inpRole").value : "student";
      $("#studentClassField").classList.toggle("hidden", !reg || role !== "student");
      $("#teacherClassField").classList.toggle("hidden", !reg || role !== "teacher");
      $("#codeField").classList.toggle("hidden", !reg || role === "student");

      $("#authTitle").textContent = reg ? "Crie sua jornada" : "Entrar na jornada";
      $("#authDesc").textContent = reg ? "Escolha seu perfil e faça seu cadastro." : "Acesse seu painel.";
      $("#authBtn").textContent = reg ? "Criar conta" : "Entrar";
    }

    function openForgotPasswordModal() {
      const emailInput = $("#inpEmail") ? $("#inpEmail").value.trim() : "";
      openModal("🔑 Recuperar Senha", `
        <form id="forgotPwdForm" class="form-grid">
          <p class="muted" style="font-size: 13px;">
            Informe seu e-mail cadastrado para receber o link de redefinição de senha.
          </p>
          <label>E-mail <input id="recoveryEmail" type="email" value="${emailInput}" required placeholder="seuemail@exemplo.com" /></label>
          <button class="primary-btn full" type="submit">Enviar Link de Recuperação</button>
        </form>
      `);

      document.getElementById("forgotPwdForm").onsubmit = async (e) => {
        e.preventDefault();
        const email = document.getElementById("recoveryEmail").value.trim();
        if (!email) return toast("Informe seu e-mail.", "error");

        try {
          await auth.sendPasswordResetEmail(email);
          closeModal();
          toast("E-mail de redefinição enviado! Confira sua caixa de entrada.", "success");
        } catch (err) {
          console.error(err);
          let errMsg = "Erro ao solicitar redefinição de senha.";
          if (err.code === "auth/user-not-found") errMsg = "E-mail não encontrado no sistema.";
          else if (err.code === "auth/invalid-email") errMsg = "E-mail inválido.";
          toast(errMsg, "error");
        }
      };
    }

    async function handleAuth(e) {
      e.preventDefault();
      const email = $("#inpEmail").value.trim();
      const pwd = $("#inpPwd").value;

      if (!email || pwd.length < 6) return toast("Informe e-mail e senha com no mínimo 6 caracteres.", "error");

      try {
        if (isRegister) {
          const name = $("#inpName").value.trim();
          const role = $("#inpRole").value;
          let photoURL = $("#inpPhoto").value.trim();
          const fileInput = $("#inpPhotoFile");
          const code = $("#inpCode") ? $("#inpCode").value.trim() : "";

          if (!name) return toast("Informe seu nome completo.", "error");

          if (fileInput && fileInput.files && fileInput.files[0]) {
            try { photoURL = await fileToDataUrl(fileInput.files[0]); } catch(err) { console.error(err); }
          }

          let selectedClasses = [];
          let studentClass = "";

          if (role === "teacher") {
            if (code !== PROFESSOR_CODE) return toast("Código de professor inválido.", "error");
            const checkedBoxes = document.querySelectorAll('input[name="teacherClasses"]:checked');
            selectedClasses = Array.from(checkedBoxes).map(cb => cb.value);
            if (selectedClasses.length === 0) return toast("Selecione pelo menos uma turma.", "error");
          } else if (role === "coordinator") {
            if (code !== COORDINATOR_CODE) return toast("Código de coordenador inválido.", "error");
            selectedClasses = TURMAS_DISPONIVEIS;
          } else {
            studentClass = $("#inpStudentClass").value;
            selectedClasses = [studentClass];
          }

          const cred = await auth.createUserWithEmailAndPassword(email, pwd);
          await db.collection("users").doc(cred.user.uid).set({
            name, email, role, photoURL,
            className: role === "student" ? studentClass : selectedClasses.join(", "),
            classes: selectedClasses,
            xp: 0, cactoscoins: 0, level: 1, booksRead: 0,
            unlockedThemes: ["default"], activeTheme: "default",
            isActive: true, createdAt: new Date().toISOString()
          });
          toast("Conta criada com sucesso!", "success");
        } else {
          await auth.signInWithEmailAndPassword(email, pwd);
        }
      } catch(err) {
        toast("Erro ao autenticar: " + err.message, "error");
      }
    }

    // --- INITIALIZATION ---
    auth.onAuthStateChanged(async (user) => {
      if (!user) {
        currentUser = null; currentProfile = null;
        renderAuth();
        return;
      }
      try {
        const snap = await db.collection("users").doc(user.uid).get();
        if (snap.exists) {
          currentUser = user;
          currentProfile = { uid: user.uid, ...snap.data() };
          
          if (currentProfile.activeTheme) {
            currentTheme = currentProfile.activeTheme;
            localStorage.setItem("st-active-theme", currentTheme);
          }

          renderApp();
        } else {
          renderAuth();
        }
      } catch(err) {
        console.error(err);
        renderAuth();
      }
    });

    $("#closeModalBtn").onclick = closeModal;
    $("#modal").onclick = (e) => { if (e.target === $("#modal")) closeModal(); };
  </script>
</body>
</html>
