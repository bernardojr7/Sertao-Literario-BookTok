<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sertão Literário</title>
  
  <!-- Fonts: Special Elite (Cordel) e Bitter (Leitura) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,400;0,600;0,700;1,400&family=Special+Elite&display=swap" rel="stylesheet" />

  <!-- Firebase Compat Libraries -->
  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore-compat.js"></script>

  <!-- Chart.js para Gráficos Interativos -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- html2pdf.js para Exportação do Relatório em PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    /* =========================================================
       VARIÁVEIS E DEFINIÇÃO DOS TEMAS
       ========================================================= */
    
    /* 1. TEMA PADRÃO / MODERNO */
    :root, body[data-theme="default"] {
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --surface2: #F1F5F9;
      --text: #0F172A;
      --muted: #64748B;
      --border: #CBD5E1;
      --primary: #2563EB;
      --primary-dark: #1D4ED8;
      --green: #10B981;
      --cyan: #06B6D4;
      --danger: #EF4444;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      --radius: 8px;
      --font-title: 'Bitter', serif;
      --font-body: 'Bitter', serif;
    }

    body[data-theme="default"].dark {
      --bg: #0F172A;
      --surface: #1E293B;
      --surface2: #334155;
      --text: #F8FAFC;
      --muted: #94A3B8;
      --border: #334155;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
    }

    /* 2. TEMA CORDEL & XILOGRAVURA */
    body[data-theme="cordel"] {
      --bg: #F3E9DC;
      --surface: #EADBC8;
      --surface2: #DFCFB8;
      --text: #1A1817;
      --muted: #5C5248;
      --border: #1A1817;
      --primary: #C05C33;
      --primary-dark: #A04420;
      --green: #2D6A4F;
      --cyan: #E5A93C;
      --danger: #B23B23;
      --shadow: 4px 4px 0px #1A1817;
      --radius: 6px;
      --font-title: 'Special Elite', cursive, serif;
      --font-body: 'Bitter', serif;
    }

    body[data-theme="cordel"].dark {
      --bg: #1A1817;
      --surface: #2A2421;
      --surface2: #362E2A;
      --text: #F3E9DC;
      --muted: #B8A99A;
      --border: #F3E9DC;
      --shadow: 4px 4px 0px #F3E9DC;
    }

    /* 3. TEMA SERTÃO CYBERPUNK */
    body[data-theme="sertao-cyber"] {
      --bg: #090D16;
      --surface: #111827;
      --surface2: #1F2937;
      --text: #F3F4F6;
      --muted: #9CA3AF;
      --border: #06B6D4;
      --primary: #10B981;
      --primary-dark: #059669;
      --green: #10B981;
      --cyan: #06B6D4;
      --danger: #F43F5E;
      --shadow: 0 0 12px rgba(6, 182, 212, 0.3);
      --radius: 8px;
      --font-title: 'Special Elite', cursive, serif;
      --font-body: 'Bitter', serif;
    }

    /* 4. TEMA LUAR DO SERTÃO */
    body[data-theme="luar-sertao"] {
      --bg: #0B132B;
      --surface: #1C2541;
      --surface2: #2A365C;
      --text: #EDF2F4;
      --muted: #8D99AE;
      --border: #3A506B;
      --primary: #5BC0BE;
      --primary-dark: #3A9392;
      --green: #10B981;
      --cyan: #6FFFE9;
      --danger: #EF4444;
      --shadow: 0 4px 12px rgba(91, 192, 190, 0.25);
      --radius: 8px;
      --font-title: 'Bitter', serif;
      --font-body: 'Bitter', serif;
    }

    /* 5. TEMA FLOR DE CACTO */
    body[data-theme="caatinga-florida"] {
      --bg: #FDF0ED;
      --surface: #FFFFFF;
      --surface2: #F7D6D0;
      --text: #2D1A17;
      --muted: #8C5A52;
      --border: #E63946;
      --primary: #E63946;
      --primary-dark: #C1121F;
      --green: #2A9D8F;
      --cyan: #E9C46A;
      --danger: #D62828;
      --shadow: 3px 3px 0px #E63946;
      --radius: 10px;
      --font-title: 'Special Elite', cursive, serif;
      --font-body: 'Bitter', serif;
    }

    /* 6. TEMA SOL DOURADO */
    body[data-theme="sol-dourado"] {
      --bg: #FFFBEA;
      --surface: #FFF3C4;
      --surface2: #FFE89C;
      --text: #3D2600;
      --muted: #855B14;
      --border: #B45309;
      --primary: #D97706;
      --primary-dark: #B45309;
      --green: #059669;
      --cyan: #F59E0B;
      --danger: #DC2626;
      --shadow: 3px 3px 0px #B45309;
      --radius: 6px;
      --font-title: 'Bitter', serif;
      --font-body: 'Bitter', serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      transition: background .25s, color .25s;
    }

    .emoji-custom {
      width: 1.25em;
      height: 1.25em;
      vertical-align: -0.2em;
      display: inline-block;
      object-fit: contain;
      user-select: none;
      pointer-events: none;
    }

    h1, h2, h3, h4, .brand, .page-title h1, .stat-value, .book-cover {
      font-family: var(--font-title) !important;
      letter-spacing: 0.5px;
    }

    button, input, select, textarea { font: inherit; }
    button { border: 0; cursor: pointer; }
    .hidden { display: none !important; }

    /* Toast Notifications */
    .toast {
      position: fixed; right: 22px; top: 22px; z-index: 50;
      max-width: 380px; padding: 16px 20px; border-radius: var(--radius);
      color: var(--bg); background: var(--text); border: 2px solid var(--border);
      box-shadow: var(--shadow); transform: translateY(-12px); opacity: 0; transition: .25s;
      font-weight: 600;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { background: var(--green); color: #fff; }
    .toast.error { background: var(--danger); color: #fff; }

    /* Form Components */
    .form-grid { display: grid; gap: 16px; }
    label { display: grid; gap: 7px; color: var(--text); font-size: 13px; font-weight: 700; text-transform: uppercase; }
    input, select, textarea {
      width: 100%; padding: 12px 14px; border: 2px solid var(--border); border-radius: var(--radius);
      outline: none; color: var(--text); background: var(--bg); transition: border .2s;
    }
    textarea { min-height: 90px; resize: vertical; }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); }

    .checkbox-item { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text); cursor: pointer; text-transform: none; }
    .checkbox-item input { width: auto; }

    .primary-btn, .secondary-btn, .danger-btn, .btn-editar {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 44px; padding: 10px 18px; border-radius: var(--radius); font-weight: 700;
      border: 2px solid var(--border); transition: transform .1s, box-shadow .1s;
      box-shadow: var(--shadow); text-transform: uppercase; font-size: 13px;
    }
    .primary-btn { color: #fff; background: var(--primary); }
    .secondary-btn, .btn-editar { color: var(--text); background: var(--surface2); }
    .danger-btn { color: white; background: var(--danger); }
    .primary-btn:hover, .secondary-btn:hover, .danger-btn:hover, .btn-editar:hover { transform: translate(-2px, -2px); }
    .primary-btn:active, .secondary-btn:active, .danger-btn:active, .btn-editar:active { transform: translate(1px, 1px); }
    .full { width: 100%; }

    /* Layout */
    .app-shell { min-height: 100vh; padding-bottom: 92px; }
    .topbar {
      position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 16px clamp(14px, 5vw, 70px);
      border-bottom: 2px solid var(--border); background: var(--surface);
    }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 24px; font-weight: 800; cursor: pointer; }
    .brand-mark {
      width: 40px; height: 40px; display: grid; place-items: center; border-radius: var(--radius);
      background: var(--primary); color: #fff; font-size: 20px; border: 2px solid var(--border);
      box-shadow: var(--shadow); overflow: hidden; flex-shrink: 0;
    }
    .top-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border: 2px solid var(--border); border-radius: var(--radius); color: var(--text); background: var(--surface2); box-shadow: var(--shadow); font-weight: bold; flex-shrink: 0; }
    .user-pill { display: flex; align-items: center; gap: 8px; padding: 4px 10px 4px 4px; border: 2px solid var(--border); border-radius: var(--radius); background: var(--surface2); font-weight: 600; font-size: 13px; }

    .avatar {
      width: 32px; height: 32px; border-radius: var(--radius);
      background: var(--primary); border: 2px solid var(--border);
      color: white; font-weight: 800; font-size: 13px;
      display: grid; place-items: center; overflow: hidden; flex-shrink: 0;
    }

    .page { width: min(1400px, 100%); margin: 0 auto; padding: 24px clamp(14px, 5vw, 70px); }
    .page-title { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
    .page-title h1 { font-size: clamp(28px, 4.5vw, 48px); line-height: 1.1; }
    .page-title p { margin-top: 6px; color: var(--muted); font-size: 14px; }

    .panel { border: 2px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); padding: 20px; }
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
    .book-card, .card-livro {
      overflow: hidden; border: 2px solid var(--border); border-radius: var(--radius);
      background: var(--surface); box-shadow: var(--shadow); display: flex; flex-direction: column;
    }
    .book-cover { height: 180px; display: grid; place-items: center; background: var(--surface2); color: var(--text); border-bottom: 2px solid var(--border); font-size: 32px; overflow: hidden; position: relative; }
    .book-cover img { width: 100%; height: 100%; object-fit: cover; }
    .book-content { padding: 16px; flex: 1; display: flex; flex-direction: column; }
    .book-content h3, .card-livro .titulo { margin-bottom: 4px; font-size: 18px; }
    .book-content p.autor, .card-livro .autor { color: var(--muted); font-size: 12px; font-weight: 600; margin-bottom: 8px; }
    
    .card-livro .resumo {
      color: var(--text); font-size: 12px; line-height: 1.5; font-style: italic;
      margin: 8px 0 12px 0; flex: 1; display: -webkit-box; -webkit-line-clamp: 3;
      -webkit-box-orient: vertical; overflow: hidden; background: var(--bg);
      padding: 8px 10px; border-radius: var(--radius); border: 1px solid var(--border);
      border-left: 4px solid var(--primary);
    }

    .book-meta, .card-livro .acoes { display: flex; align-items: center; justify-content: space-between; margin-top: auto; gap: 8px; flex-wrap: wrap; }
    .status { display: inline-flex; padding: 4px 8px; border-radius: 4px; border: 1px solid var(--border); color: var(--text); background: var(--cyan); font-size: 10px; font-weight: 700; margin-bottom: 6px; align-self: flex-start; text-transform: uppercase; }

    /* Modal */
    .modal {
      position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 14px;
      background: rgba(0,0,0,0.65); backdrop-filter: blur(4px);
    }
    .modal-card { width: min(100%, 600px); max-height: calc(100vh - 28px); overflow-y: auto; padding: 20px; border: 3px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
    .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }

    /* Bottom Navigation Bar */
    .bottom-nav {
      position: fixed; left: 50%; bottom: 12px; z-index: 40;
      width: min(680px, calc(100% - 20px));
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 4px;
      border: 2px solid var(--border); border-radius: var(--radius);
      background: var(--surface); box-shadow: var(--shadow);
      transform: translateX(-50%);
    }
    .nav-btn { display: grid; justify-items: center; gap: 2px; padding: 6px 2px; border-radius: 4px; color: var(--muted); background: transparent; font-size: 10px; font-weight: 700; }
    .nav-btn.active { color: var(--text); background: var(--cyan); border: 1px solid var(--border); box-shadow: var(--shadow); }
  </style>
</head>
<body>

  <div id="app"></div>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="modalTitle">Título</h2>
        <button id="closeModalBtn" class="icon-btn" onclick="closeModal()">×</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    // --- FIREBASE CONFIGURATION ---
    const firebaseConfig = {
      apiKey: "AIzaSyA-xVOI6qXkEndKXkSp6-zRLY01qNkQH4E",
      authDomain: "sertao-literario-booktok.firebaseapp.com",
      projectId: "sertao-literario-booktok",
      storageBucket: "sertao-literario-booktok.firebasestorage.app",
      messagingSenderId: "291651799720",
      appId: "1:291651799720:web:b5c79954511f09b8ddd09d"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;
    let currentProfile = null;

    function $(s) { return document.querySelector(s); }
    function $$(s) { return document.querySelectorAll(s); }

    function toast(msg, type = "") {
      const t = $("#toast");
      t.textContent = msg;
      t.className = "toast show " + type;
      setTimeout(() => { t.className = "toast"; }, 3500);
    }

    function openModal(title, body) {
      $("#modalTitle").textContent = title;
      $("#modalBody").innerHTML = body;
      $("#modal").classList.remove("hidden");
    }

    function closeModal() {
      $("#modal").classList.add("hidden");
    }

    function pageTitle(title, desc, extra = "") {
      return `<div class="page-title"><div><h1>${title}</h1><p>${desc}</p></div>${extra}</div>`;
    }

    // ========================================================
    // --- REGRA DE ACESSO A LIVROS POR TURMA E GÊNERO ---
    // ========================================================
    function canStudentAccessBook(book, userProfile) {
      if (!userProfile) return true;
      // Professores e Coordenadores sempre enxergam todos os livros
      if (userProfile.role !== 'student') return true;

      const userClass = userProfile.className; // Ex: "5º Ano", "9º Ano"
      const category = (book.category || "").toLowerCase();

      // 1. Regra de Leitura Direcionada (Exclusiva)
      if (book.isExclusive && book.targetClass) {
        return book.targetClass === userClass;
      }

      // 2. Restrição: Terror (Bloqueado para 5º, 6º e 7º ano)
      if (category.includes("terror")) {
        if (["5º Ano", "6º Ano", "7º Ano"].includes(userClass)) {
          return false;
        }
      }

      // 3. Restrição: Crônicas (Apenas para 8º e 9º ano)
      if (category.includes("crônica") || category.includes("cronica")) {
        if (!["8º Ano", "9º Ano"].includes(userClass)) {
          return false;
        }
      }

      // 4. Livros Livres ou sem restrição passam direto
      return true;
    }

    // --- RENDER DA BIBLIOTECA ---
    async function renderLibrary() {
      let books = [];
      try {
        const snap = await db.collection("books").get();
        snap.forEach(d => {
          const b = d.data();
          if (b.isActive !== false) books.push({ id: d.id, ...b });
        });
        books.sort((a,b) => (a.title || "").localeCompare(b.title || ""));
      } catch(error) { console.log(error); }

      // Aplica o filtro de permissões de acesso do aluno
      const availableBooks = books.filter(b => canStudentAccessBook(b, currentProfile));
      const isStaff = currentProfile && currentProfile.role !== "student";
      let booksHtml = availableBooks.length ? "" : '<div class="empty-state">Nenhum livro disponível para o seu perfil no momento.</div>';

      for (let b of availableBooks) {
        const coverStyle = b.coverUrl ? `<img src="${b.coverUrl}" alt="Capa" />` : '📚';

        booksHtml += `
          <div class="card-livro book-card" data-id="${b.id}">
            <div class="book-cover">${coverStyle}</div>
            <div class="book-content">
              <span class="status">${b.status || "Disponível"}</span>
              <h3 class="titulo">${b.title}</h3>
              <p class="autor">${b.author || "Autor não informado"}</p>
              ${b.summary ? `<p class="resumo">"${b.summary}"</p>` : ''}
              <div class="acoes book-meta">
                ${b.pdfUrl ? `<a class="secondary-btn" href="${b.pdfUrl}" target="_blank" style="font-size:11px;padding:6px 10px">📄 PDF</a>` : ''}
                ${isStaff ? `<button class="btn-editar" style="font-size:11px;padding:6px 10px" onclick="abrirModalEdicao('${b.id}')">✏️ Editar</button>` : ''}
                ${isStaff ? `<button class="danger-btn" style="font-size:11px;padding:6px 10px" data-del="${b.id}">Excluir</button>` : ''}
                ${!isStaff ? `<button class="primary-btn" style="font-size:11px;padding:6px 10px" onclick="openRegisterReadingModal('${b.title.replace(/'/g,"\\'")}')">Registrar Leitura</button>` : ''}
              </div>
            </div>
          </div>`;
      }

      $("#pageContent").innerHTML =
        pageTitle("Biblioteca Sertaneja", isStaff ? "Cadastre e gerencie o acervo da escola." : "Escolha sua leitura e registre seu progresso.", isStaff ? '<button class="primary-btn" id="addBookBtn">+ Cadastrar Livro</button>' : "") +
        `<div class="panel">
          <div class="flex" style="margin-bottom:18px"><input id="searchInput" placeholder="🔍 Buscar por título, autor ou palavra-chave..." style="flex:1" /></div>
          <div id="booksGrid" class="cards-grid">${booksHtml}</div>
        </div>`;

      $("#searchInput").oninput = (e) => {
        const t = e.target.value.toLowerCase();
        $$(".card-livro").forEach(card => {
          card.style.display = card.textContent.toLowerCase().includes(t) ? "" : "none";
        });
      };

      const addBtn = $("#addBookBtn");
      if (addBtn) {
        addBtn.onclick = () => {
          openModal("Cadastrar Novo Livro", `
            <form id="bookForm" class="form-grid">
              <label>Título <input name="title" required /></label>
              <label>Autor <input name="author" required /></label>
              <label>Páginas <input name="pages" type="number" min="1" required /></label>
              
              <label>Categoria / Gênero
                <select name="category">
                  <option value="Livre">Livre (Todos os anos)</option>
                  <option value="Terror">Terror (Bloqueado 5º ao 7º ano)</option>
                  <option value="Crônicas">Crônicas (Apenas 8º e 9º ano)</option>
                </select>
              </label>

              <label>Direcionar para Turma Específica (Opcional)
                <select name="targetClass">
                  <option value="">Nenhuma (Disponível pelas regras normais)</option>
                  <option value="5º Ano">5º Ano</option>
                  <option value="6º Ano">6º Ano</option>
                  <option value="7º Ano">7º Ano</option>
                  <option value="8º Ano">8º Ano</option>
                  <option value="9º Ano">9º Ano</option>
                </select>
              </label>

              <label class="checkbox-item" style="margin-top:8px">
                <input type="checkbox" name="isExclusive" value="true" />
                🔒 **Manter leitura EXCLUSIVA para a turma selecionada**
              </label>

              <label>Resumo / Sinopse <textarea name="summary" placeholder="Escreva um breve resumo..."></textarea></label>
              <label>Capa - Escolher Imagem <input type="file" id="inpCoverFile" accept="image/*" /></label>
              <label>Ou Link/URL da Capa <input name="coverUrl" id="inpCoverUrl" placeholder="https://..." /></label>
              <label>Link do PDF (Opcional) <input name="pdfUrl" type="url" placeholder="https://..." /></label>
              <button class="primary-btn full" type="submit">Salvar Livro</button>
            </form>`);

          $("#bookForm").onsubmit = async (e) => {
            e.preventDefault();
            const fd = new FormData(e.target);
            let coverUrl = fd.get("coverUrl");

            await db.collection("books").add({
              title: fd.get("title"), 
              author: fd.get("author"),
              pages: Number(fd.get("pages")), 
              category: fd.get("category"),
              targetClass: fd.get("targetClass") || "",
              isExclusive: fd.get("isExclusive") === "true",
              summary: fd.get("summary") || "", 
              coverUrl: coverUrl || "",
              pdfUrl: fd.get("pdfUrl") || "", 
              status: "Disponível", 
              isActive: true,
              createdAt: new Date().toISOString()
            });

            closeModal();
            toast("Livro cadastrado com sucesso!", "success");
            renderLibrary();
          };
        };
      }

      $$("[data-del]").forEach(btn => {
        btn.onclick = async function() {
          if (confirm("Excluir este livro?")) {
            await db.collection("books").doc(this.dataset.del).delete();
            toast("Livro removido.");
            renderLibrary();
          }
        };
      });
    }

    async function abrirModalEdicao(id) {
      try {
        const doc = await db.collection("books").doc(String(id)).get();
        if (!doc.exists) return toast("Livro não encontrado.", "error");
        const book = doc.data();

        openModal("✏️ Editar Livro", `
          <form id="editBookForm" class="form-grid">
            <label>Título <input name="title" value="${book.title || ''}" required /></label>
            <label>Autor <input name="author" value="${book.author || ''}" required /></label>
            <label>Status <input name="status" value="${book.status || 'Disponível'}" required /></label>
            <label>Páginas <input name="pages" type="number" min="1" value="${book.pages || 0}" required /></label>
            
            <label>Categoria / Gênero
              <select name="category">
                <option value="Livre" ${book.category === 'Livre' ? 'selected' : ''}>Livre (Todos os anos)</option>
                <option value="Terror" ${book.category === 'Terror' ? 'selected' : ''}>Terror (Bloqueado 5º ao 7º ano)</option>
                <option value="Crônicas" ${book.category === 'Crônicas' || book.category === 'Cronicas' ? 'selected' : ''}>Crônicas (Apenas 8º e 9º ano)</option>
              </select>
            </label>

            <label>Direcionar para Turma Específica (Opcional)
              <select name="targetClass">
                <option value="" ${!book.targetClass ? 'selected' : ''}>Nenhuma (Disponível pelas regras normais)</option>
                <option value="5º Ano" ${book.targetClass === '5º Ano' ? 'selected' : ''}>5º Ano</option>
                <option value="6º Ano" ${book.targetClass === '6º Ano' ? 'selected' : ''}>6º Ano</option>
                <option value="7º Ano" ${book.targetClass === '7º Ano' ? 'selected' : ''}>7º Ano</option>
                <option value="8º Ano" ${book.targetClass === '8º Ano' ? 'selected' : ''}>8º Ano</option>
                <option value="9º Ano" ${book.targetClass === '9º Ano' ? 'selected' : ''}>9º Ano</option>
              </select>
            </label>

            <label class="checkbox-item" style="margin-top:8px">
              <input type="checkbox" name="isExclusive" value="true" ${book.isExclusive ? 'checked' : ''} />
              🔒 **Manter leitura EXCLUSIVA para a turma selecionada**
            </label>

            <label>Resumo / Sinopse <textarea name="summary">${book.summary || ''}</textarea></label>
            <label>URL da Capa <input name="coverUrl" value="${book.coverUrl || ''}" /></label>
            <label>Link do PDF <input name="pdfUrl" value="${book.pdfUrl || ''}" /></label>
            <button class="primary-btn full" type="submit">Salvar Alterações</button>
          </form>`);

        $("#editBookForm").onsubmit = async (e) => {
          e.preventDefault();
          const fd = new FormData(e.target);
          await db.collection("books").doc(String(id)).update({
            title: fd.get("title"), 
            author: fd.get("author"), 
            status: fd.get("status"),
            pages: Number(fd.get("pages")), 
            category: fd.get("category"),
            targetClass: fd.get("targetClass") || "",
            isExclusive: fd.get("isExclusive") === "true",
            summary: fd.get("summary"), 
            coverUrl: fd.get("coverUrl"), 
            pdfUrl: fd.get("pdfUrl")
          });
          closeModal();
          toast("Livro atualizado!", "success");
          renderLibrary();
        };
      } catch(error) { console.log(error); }
    }
    window.abrirModalEdicao = abrirModalEdicao;
  </script>
</body>
</html>
