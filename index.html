  <style>
    /* =========================================================

       ========================================================= */
    :root, body[data-theme="default"] {
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --surface2: #F1F5F9;
      --text: #0F172A;
      --muted: #64748B;
      --border: #CBD5E1;
      --primary: #2563EB;
      --primary-dark: #1D4ED8;
      --green: #10B981;
      --cyan: #06B6D4;

      --warning: #F59E0B;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --radius: 8px;

      --font-body: 'Inter', sans-serif;
    }

    body[data-theme="default"].dark {

      --surface: #1E293B;
      --surface2: #334155;
      --text: #F8FAFC;
      --muted: #94A3B8;

      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
    }

    body[data-theme="cordel"] {

    /* =========================================================
       2. ESTRUTURA GLOBAL E REGRAS DE LAYOUT
       ========================================================= */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; overflow-x: hidden; }
    body {
      min-height: 100vh;
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      transition: background 0.25s, color 0.25s;
      line-height: 1.5;
    }

    .emoji-custom {
      width: 1.25em;
      height: 1.25em;
      vertical-align: -0.2em;
      display: inline-block;
      object-fit: contain;
      pointer-events: none;
    }

    h1, h2, h3, h4, .brand, .page-title h1, .stat-value, .book-cover {
      font-family: var(--font-title) !important;
      letter-spacing: 0.3px;
    }

    button, input, select, textarea { font: inherit; }
    button { border: 0; cursor: pointer; transition: transform 0.15s, opacity 0.15s, background 0.2s; }
    button:active { transform: scale(0.97); }
    .hidden { display: none !important; }

    /* Notificações e Toast */
    .toast {
      position: fixed; right: 22px; top: 22px; z-index: 9999; max-width: 380px; padding: 16px 20px;
      border-radius: var(--radius); color: var(--bg); background: var(--text); border: 2px solid var(--border);
      box-shadow: var(--shadow); transform: translateY(-20px); opacity: 0; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      font-weight: 600; pointer-events: none;
    }
    .toast.show { transform: translateY(0); opacity: 1; pointer-events: auto; }
    .toast.success { background: var(--green); color: #fff; border-color: var(--green); }
    .toast.error { background: var(--danger); color: #fff; border-color: var(--danger); }

    /* Shell do App e Topbar */
    .app-shell { min-height: 100vh; padding-bottom: 92px; }
    .topbar {
      position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 14px clamp(14px, 5vw, 70px); border-bottom: 2px solid var(--border);
      background: var(--surface); backdrop-filter: blur(8px);
    }
    
    .brand { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 800; cursor: pointer; color: var(--text); }
    .brand-mark {
      width: 40px; height: 40px; display: grid; place-items: center; border-radius: var(--radius);
      background: var(--primary); color: #fff; font-size: 20px; border: 2px solid var(--border);
      box-shadow: var(--shadow); overflow: hidden; flex-shrink: 0;
    }
    .brand-mark img { width: 100%; height: 100%; object-fit: cover; }
    
    .top-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .icon-btn {
      width: 40px; height: 40px; display: grid; place-items: center; border: 2px solid var(--border);
      border-radius: var(--radius); color: var(--text); background: var(--surface2); box-shadow: var(--shadow);
      font-weight: bold; flex-shrink: 0;
    }
    .icon-btn:hover { background: var(--border); }

    .user-pill {
      display: flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px;
      border: 2px solid var(--border); border-radius: var(--radius); background: var(--surface2);
      font-weight: 600; font-size: 13px;
    }
    
    .avatar {
      width: 32px; height: 32px; border-radius: var(--radius); background: var(--primary);
      border: 2px solid var(--border); color: white; font-weight: 800; font-size: 13px;
      display: grid; place-items: center; overflow: hidden; flex-shrink: 0;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }

    .page { width: min(1400px, 100%); margin: 0 auto; padding: 24px clamp(14px, 5vw, 70px); }
    .page-title { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
    .page-title h1 { font-size: clamp(26px, 4vw, 42px); line-height: 1.1; }
    .page-title p { margin-top: 6px; color: var(--muted); font-size: 14px; }

    /* Componentes de Estatísticas e Painéis */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-bottom: 24px; }
    .stat-card {
      position: relative; overflow: hidden; padding: 18px; border: 2px solid var(--border);
      border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow);
    }
    .stat-label { color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-value { font-size: 28px; line-height: 1.1; margin-top: 6px; color: var(--primary); display: flex; align-items: center; gap: 6px; }
    .stat-icon { margin-bottom: 6px; font-size: 22px; }

    .panel { border: 2px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); padding: 20px; margin-bottom: 20px; }
    .panel-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    .panel-header h2 { font-size: 20px; }
    .content-grid { display: grid; grid-template-columns: 1.35fr 0.65fr; gap: 18px; margin-top: 18px; }

    /* Cards e Grades de Conteúdo */
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; }
    .book-card, .card-livro, .post-card, .campaign-card {
      overflow: hidden; border: 2px solid var(--border); border-radius: var(--radius);
      background: var(--surface); box-shadow: var(--shadow); display: flex; flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .book-card:hover, .card-livro:hover, .post-card:hover { transform: translateY(-3px); }
    
    .book-cover {
      height: 200px; display: grid; place-items: center; background: var(--surface2);
      color: var(--text); border-bottom: 2px solid var(--border); font-size: 32px;
      overflow: hidden; position: relative;
    }
    .book-cover img { width: 100%; height: 100%; object-fit: cover; }
    .book-content, .post-content, .campaign-content { padding: 16px; flex: 1; display: flex; flex-direction: column; gap: 8px; }

    /* Botões e Ações */
    .btn, .primary-btn, .secondary-btn, .outline-btn {
      padding: 10px 18px; border-radius: var(--radius); font-weight: 600; font-size: 14px;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 2px solid var(--border);
    }
    .primary-btn { background: var(--primary); color: #fff; border-color: var(--primary-dark); }
    .primary-btn:hover { background: var(--primary-dark); }
    .secondary-btn { background: var(--surface2); color: var(--text); }
    .outline-btn { background: transparent; color: var(--text); }
    .full { width: 100%; }

    /* Formulários e Entradas */
    .form-grid { display: grid; gap: 14px; }
    .form-grid label { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 13px; color: var(--text); }
    .form-grid input, .form-grid select, .form-grid textarea {
      padding: 10px 12px; border: 2px solid var(--border); border-radius: var(--radius);
      background: var(--bg); color: var(--text); outline: none; transition: border-color 0.2s;
    }
    .form-grid input:focus, .form-grid select:focus, .form-grid textarea:focus { border-color: var(--primary); }
    .form-grid textarea { min-height: 90px; resize: vertical; }

    /* Modais e Caixas Pop-up */
    .modal { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; padding: 16px; background: rgba(0,0,0,0.65); backdrop-filter: blur(4px); }
    .modal-card { width: min(100%, 620px); max-height: calc(100vh - 32px); overflow-y: auto; padding: 24px; border: 3px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
    .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; border-bottom: 2px solid var(--border); padding-bottom: 12px; }

    /* Menu Flutuante Inferior (Navegação Principal) */
    .bottom-nav {
      position: fixed; left: 50%; bottom: 12px; z-index: 500; width: min(680px, calc(100% - 20px));
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 6px;
      border: 2px solid var(--border); border-radius: var(--radius); background: var(--surface);
      box-shadow: var(--shadow); transform: translateX(-50%);
    }
    .nav-btn { display: grid; justify-items: center; gap: 2px; padding: 8px 4px; border-radius: var(--radius); color: var(--muted); background: transparent; font-size: 11px; font-weight: 700; }
    .nav-btn.active { color: var(--text); background: var(--cyan); border: 1px solid var(--border); box-shadow: var(--shadow); }

    /* Gráficos e Barras de Progresso */
    .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
    .chart-card { background: var(--surface); border: 2px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); position: relative; }
    .chart-container { position: relative; width: 100%; height: 240px; }
    
    .progress { height: 10px; background: var(--surface2); border-radius: 20px; border: 1px solid var(--border); overflow: hidden; margin-top: 6px; }
    .progress-bar, #uploadPostBar { height: 100%; background: var(--primary); transition: width 0.3s; }

    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 700; border: 1px solid var(--border); background: var(--surface2); }

    /* Regras Adaptativas para Telas Menores */
    @media (max-width: 1050px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } .content-grid, .chart-grid { grid-template-columns: 1fr; } }
    @media (max-width: 640px) { .page { padding: 16px 12px 100px; } .cards-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <!-- Estrutura Principal da Aplicação -->
  <div id="app"></div>

  <!-- Modal Global -->
  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="modalTitle">Título do Modal</h2>
        <button id="closeModalBtn" class="icon-btn" onclick="closeModal()">×</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <!-- Componente Toast de Notificação -->
  <div id="toast" class="toast"></div>

  <script>
    /* =========================================================
       3. INICIALIZAÇÃO E CREDENCIAIS (FIREBASE & CLOUDINARY)
       ========================================================= */
    const firebaseConfig = {
      apiKey: "AIzaSyA-xVOI6qXkEndKXkSp6-zRLY01qNkQH4E",
      authDomain: "sertao-literario-booktok.firebaseapp.com",
      projectId: "sertao-literario-booktok",
      storageBucket: "sertao-literario-booktok.firebasestorage.app",
      messagingSenderId: "291651799720",
      appId: "1:291651799720:web:b5c79954511f09b8ddd09d"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const CLOUDINARY_CLOUD_NAME = "w0pi8vpn";
    const CLOUDINARY_UPLOAD_PRESET = "sertão literário";

    async function uploadToCloudinary(file, onProgress = null) {
      if (!file) return null;
      const url = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/auto/upload`;
      const formData = new FormData();
      formData.append("file", file);
      formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);

      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open("POST", url);

        if (onProgress && xhr.upload) {
          xhr.upload.onprogress = (e) => {
            if (e.lengthComputable) {
              const percent = Math.round((e.loaded / e.total) * 100);
              onProgress(percent);
            }
          };
        }

        xhr.onload = () => {
          if (xhr.status >= 200 && xhr.status < 300) {
            const res = JSON.parse(xhr.responseText);
            resolve(res.secure_url);
          } else {
            reject(new Error("Erro no envio para o Cloudinary"));
          }
        };

        xhr.onerror = () => reject(new Error("Erro de conexão no envio"));
        xhr.send(formData);
      });
    }

    /* =========================================================
       4. ESTADO DA APLICAÇÃO E MAPEAMENTO DE RECURSOS
       ========================================================= */
    const EMOJI_ASSETS = {
      cactocoin:  'assets/emojis/cactocoin.PNG',
      sol:        'assets/emojis/sol.png',
      cordel:     'assets/emojis/cordel.PNG',
      sanfona:    'assets/emojis/sanfona.PNG',
      chapeu:     'assets/emojis/chapeu.png',
      booktok:    'assets/emojis/booktok.PNG',
      relatorio:  'assets/emojis/relatorio.PNG',
      semente:    'assets/emojis/semente.PNG',
      brotinho:   'assets/emojis/brotinho.PNG',
      asa_branca: 'assets/emojis/asa-branca.PNG'
    };

    function emoji(key, alt = '') {
      const src = EMOJI_ASSETS[key];
      return src ? `<img src="${src}" class="emoji-custom" alt="${alt || key}" loading="lazy">` : key;
    }

    const APP_THEMES = [
      { id: "default", name: "Padrão Moderno", priceCoins: 0, requiredXp: 0, icon: "🎨", desc: "Interface limpa e acessível" },
      { id: "cordel", name: "Cordel & Xilogravura", priceCoins: 150, requiredXp: 100, icon: emoji('cordel'), desc: "Papel pardo rústico e tipografia entalhada" },
      { id: "sertao-cyber", name: "Sertão Cyberpunk", priceCoins: 300, requiredXp: 250, icon: "⚡", desc: "Futurismo neon e alta tecnologia" },
      { id: "luar-sertao", name: "Luar do Sertão", priceCoins: 200, requiredXp: 150, icon: "🌙", desc: "Modo noturno poético e azul profundo" },
      { id: "caatinga-florida", name: "Flor de Cacto", priceCoins: 250, requiredXp: 200, icon: "🌸", desc: "Visual alegre e vibrante pós-chuva" },
      { id: "sol-dourado", name: "Sol Dourado", priceCoins: 180, requiredXp: 120, icon: emoji('sol'), desc: "Tons quentes de terracota" }
    ];

    let currentUser = null;
    let currentProfile = null;
    let currentPage = "home";
    let selectedTeacherClass = "5º Ano";
    let selectedPeriod = "1º Bimestre";
    let currentTheme = localStorage.getItem("st-active-theme") || "default";
    let isDarkMode = localStorage.getItem("st-dark-mode") === "true";

    function applyThemeSettings() {
      document.body.setAttribute("data-theme", currentTheme);
      document.body.classList.toggle("dark", isDarkMode);
    }
    applyThemeSettings();

    function $(s) { return document.querySelector(s); }
    function $$(s) { return document.querySelectorAll(s); }

    function toast(msg, type = "") {
      const t = $("#toast");
      t.textContent = msg;
      t.className = "toast show " + type;
      setTimeout(() => { t.className = "toast"; }, 3500);
    }

    function openModal(title, body) {
      $("#modalTitle").textContent = title;
      $("#modalBody").innerHTML = body;
      $("#modal").classList.remove("hidden");
    }

    function closeModal() {
      $("#modal").classList.add("hidden");
    }
    /* =========================================================
       5. AUTENTICAÇÃO E GESTÃO DE PERFIL (FIREBASE AUTH)
       ========================================================= */
    auth.onAuthStateChanged(async (user) => {
      if (user) {
        currentUser = user;
        await loadUserProfile(user.uid);
      } else {
        currentUser = null;
        currentProfile = null;
      }
      renderApp();
    });

    async function loadUserProfile(uid) {
      try {
        const doc = await db.collection("users").doc(uid).get();
        if (doc.exists) {
          currentProfile = { id: doc.id, ...doc.data() };
          if (currentProfile.activeTheme) {
            currentTheme = currentProfile.activeTheme;
            applyThemeSettings();
          }
        } else {
          currentProfile = {
            id: uid,
            name: currentUser.displayName || "Sertanejo Leitor",
            email: currentUser.email,
            role: "aluno",
            classGroup: "5º Ano",
            xp: 0,
            coins: 50,
            streak: 1,
            unlockedThemes: ["default"],
            activeTheme: "default",
            avatarUrl: ""
          };
          await db.collection("users").doc(uid).set(currentProfile);
        }
      } catch (err) {
        console.error("Erro ao carregar perfil:", err);
        toast("Erro ao carregar perfil do usuário", "error");
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = $("#loginEmail").value;
      const pass = $("#loginPassword").value;
      try {
        await auth.signInWithEmailAndPassword(email, pass);
        toast("Login efetuado com sucesso!", "success");
        closeModal();
      } catch (err) {
        toast("Falha no login: " + err.message, "error");
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const name = $("#regName").value;
      const email = $("#regEmail").value;
      const pass = $("#regPassword").value;
      const role = $("#regRole").value;
      const classGroup = $("#regClass").value;

      try {
        const cred = await auth.createUserWithEmailAndPassword(email, pass);
        await cred.user.updateProfile({ displayName: name });
        const newProfile = {
          id: cred.user.uid,

    async function addRewards(xpGained, coinsGained) {
      if (!currentUser || !currentProfile) return;
      const newXp = (currentProfile.xp || 0) + xpGained;
      const newCoins = (currentProfile.coins || 0) + coinsGained;
      currentProfile.xp = newXp;
      currentProfile.coins = newCoins;

      await db.collection("users").doc(currentUser.uid).update({
        xp: newXp,
        coins: newCoins
      });

      toast(`+${xpGained} XP | +${coinsGained} ${emoji('cactocoin')}`, "success");

    async function loadBookTokPosts() {
      const container = $("#postsFeedContainer");
      if (!container) return;

      try {
        let query = db.collection("posts").orderBy("createdAt", "desc").limit(20);
        const snapshot = await query.get();

        if (snapshot.empty) {
          container.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--muted); padding: 40px;">Nenhuma publicação encontrada no momento. Seja o primeiro a publicar!</p>`;
          return;
        }

        let html = "";
        snapshot.docs.forEach(doc => {
          const post = { id: doc.id, ...doc.data() };
          if (booktokFilter !== "all" && post.type !== booktokFilter) return;

          const isLiked = post.likesList?.includes(currentUser?.uid);
          
          html += `
            <div class="post-card">
              ${post.mediaUrl ? `
                <div class="book-cover" style="height: 240px; background: #000;">
                  ${post.mediaType === 'video' ? `
                    <video src="${post.mediaUrl}" controls style="width:100%; height:100%; object-fit:cover;"></video>
                  ` : `
                    <img src="${post.mediaUrl}" alt="Mídia do Post">
                  `}
                </div>
              ` : ''}
              
              <div class="post-content">
                <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
                  <div style="display: flex; align-items: center; gap: 8px;">
                    <div class="avatar" style="width:28px; height:28px; font-size:11px;">
                      ${post.userAvatar ? `<img src="${post.userAvatar}" alt="Avatar">` : (post.userName?.[0] || 'U')}
                    </div>
                    <strong style="font-size: 13px;">${post.userName || 'Anônimo'}</strong>
                  </div>
                  <span class="badge">${post.type || 'Geral'}</span>
                </div>

                <h3 style="font-size: 16px; margin-bottom: 4px;">${post.title || ''}</h3>
                <p style="font-size: 14px; color: var(--text); flex: 1; white-space: pre-line;">${post.content || ''}</p>

                ${post.bookTitle ? `
                  <div style="font-size: 12px; background: var(--surface2); padding: 6px 10px; border-radius: var(--radius); margin-top: 8px;">
                    📚 Livro: <strong>${post.bookTitle}</strong>
                  </div>
                ` : ''}

                <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--border);">
                  <button class="outline-btn" style="padding: 4px 10px; font-size: 12px;" onclick="toggleLikePost('${post.id}', ${isLiked})">
                    ${isLiked ? '❤️' : '🤍'} ${post.likesCount || 0}
                  </button>
                  <button class="outline-btn" style="padding: 4px 10px; font-size: 12px;" onclick="openCommentsModal('${post.id}')">
                    💬 ${post.commentsCount || 0} Comentários
                  </button>
                </div>
              </div>
            </div>
          `;
        });

        container.innerHTML = html || `<p style="grid-column: 1/-1; text-align: center; color: var(--muted); padding: 40px;">Nenhum post nesta categoria.</p>`;
      } catch (err) {
        console.error("Erro ao carregar posts:", err);
        container.innerHTML = `<p style="color: var(--danger);">Erro ao carregar o feed do BookTok.</p>`;
      }
    }

    async function toggleLikePost(postId, isLiked) {
      if (!currentUser) return toast("Faça login para curtir posts!", "error");

      const postRef = db.collection("posts").doc(postId);
      try {
        if (isLiked) {
          await postRef.update({
            likesList: firebase.firestore.FieldValue.arrayRemove(currentUser.uid),
            likesCount: firebase.firestore.FieldValue.increment(-1)
          });
        } else {
          await postRef.update({
            likesList: firebase.firestore.FieldValue.arrayUnion(currentUser.uid),
            likesCount: firebase.firestore.FieldValue.increment(1)
          });
        }
        loadBookTokPosts();
      } catch (err) {
        toast("Erro ao processar curtida.", "error");
      }
    }

    async function handleCreatePost(e) {
      e.preventDefault();
      const title = $("#postTitle").value;
      const type = $("#postType").value;
      const bookTitle = $("#postBookTitle").value;
      const content = $("#postContent").value;
      const fileInput = $("#postMediaFile");
      const file = fileInput.files[0];

      const submitBtn = $("#submitPostBtn");
      submitBtn.disabled = true;
      submitBtn.textContent = "Publicando...";

      let mediaUrl = "";
      let mediaType = "";

      try {
        if (file) {
          $("#uploadProgressWrapper").classList.remove("hidden");
          mediaType = file.type.startsWith("video") ? "video" : "image";
          mediaUrl = await uploadToCloudinary(file, (percent) => {
            $("#uploadPostBar").style.width = `${percent}%`;
          });
        }

        const newPost = {
          title,
          type,
          bookTitle,
          content,
          mediaUrl,
          mediaType,
          userId: currentUser.uid,
          userName: currentProfile?.name || "Anônimo",
          userAvatar: currentProfile?.avatarUrl || "",
          likesCount: 0,
          likesList: [],
          commentsCount: 0,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        };

        await db.collection("posts").add(newPost);
        await addRewards(15, 10);
        toast("Post publicado com sucesso!", "success");
        closeModal();
        if (currentPage === "booktok") loadBookTokPosts();
      } catch (err) {
        console.error("Erro ao criar post:", err);
        toast("Erro ao publicar: " + err.message, "error");
        submitBtn.disabled = false;
        submitBtn.textContent = "Publicar (+15 XP)";
      }
    }

    async function buyTheme(themeId, price, requiredXp) {
      if (!currentUser || !currentProfile) return toast("Faça login para comprar temas!", "error");
      if ((currentProfile.coins || 0) < price) return toast("Saldo de Cactoscoins insuficiente!", "error");
      if ((currentProfile.xp || 0) < requiredXp) return toast(`Você precisa de pelo menos ${requiredXp} XP!`, "error");

      try {
        const unlocked = currentProfile.unlockedThemes || ["default"];
        if (!unlocked.includes(themeId)) unlocked.push(themeId);

        const newCoins = (currentProfile.coins || 0) - price;
        currentProfile.coins = newCoins;
        currentProfile.unlockedThemes = unlocked;
        currentProfile.activeTheme = themeId;

        await db.collection("users").doc(currentUser.uid).update({
          coins: newCoins,
          unlockedThemes: unlocked,
          activeTheme: themeId
        });

        currentTheme = themeId;
        applyThemeSettings();
        toast("Tema desbloqueado e ativado com sucesso!", "success");
        renderApp();
      } catch (err) {
        toast("Erro ao realizar compra: " + err.message, "error");
      }
    }

    async function activateTheme(themeId) {
      if (!currentUser) return;
      currentProfile.activeTheme = themeId;
      currentTheme = themeId;
      applyThemeSettings();

      await db.collection("users").doc(currentUser.uid).update({ activeTheme: themeId });
      toast("Tema alterado!", "success");
      renderApp();

       11. PÁGINA: PERFIL DO USUÁRIO E CONQUISTAS
       ========================================================= */
    function renderProfilePage() {
      if (!currentUser) {
        return `
          <div style="text-align: center; padding: 60px 20px;">
            <h2>Você precisa estar conectado para acessar o Perfil.</h2>
            <p style="color: var(--muted); margin-top: 8px;">Entre na sua conta ou cadastre-se para acompanhar seu progresso.</p>
            <button class="primary-btn" style="margin-top: 16px;" onclick="openAuthModal('login')">Fazer Login</button>
          </div>
        `;
      }

      return `
        <div class="page-title">
          <div>
            <h1>Seu Perfil ${emoji('chapeu')}</h1>
            <p>Gerencie suas informações e acompanhe sua trajetória de leitura.</p>
          </div>
        </div>

        <div class="content-grid">
          <div class="panel">
            <div class="panel-header">
              <h2>Informações do Estudante</h2>
            </div>
            <form class="form-grid" onsubmit="handleUpdateProfile(event)">
              <label>
                Nome Completo
                <input type="text" id="profName" value="${currentProfile?.name || ''}" required>
              </label>

              <label>
                E-mail (Não alterável)
                <input type="email" value="${currentProfile?.email || ''}" disabled style="opacity: 0.7;">
              </label>

              <label>
                Turma / Ano Escolar
                <select id="profClass">
                  <option value="5º Ano" ${currentProfile?.classGroup === '5º Ano' ? 'selected' : ''}>5º Ano</option>
                  <option value="6º Ano" ${currentProfile?.classGroup === '6º Ano' ? 'selected' : ''}>6º Ano</option>
                  <option value="7º Ano" ${currentProfile?.classGroup === '7º Ano' ? 'selected' : ''}>7º Ano</option>
                  <option value="8º Ano" ${currentProfile?.classGroup === '8º Ano' ? 'selected' : ''}>8º Ano</option>
                  <option value="9º Ano" ${currentProfile?.classGroup === '9º Ano' ? 'selected' : ''}>9º Ano</option>
                </select>
              </label>

              <label>
                URL da Foto de Perfil
                <input type="text" id="profAvatar" value="${currentProfile?.avatarUrl || ''}" placeholder="https://exemplo.com/foto.jpg">
              </label>

              <button type="submit" class="primary-btn" style="margin-top: 10px;">Salvar Alterações</button>
            </form>
          </div>

          <div class="panel">
            <div class="panel-header">
              <h2>Conquistas</h2>
            </div>
            <div style="display: flex; flex-direction: column; gap: 12px;">
              <div style="display: flex; align-items: center; gap: 10px; background: var(--surface2); padding: 10px; border-radius: var(--radius);">
                <span style="font-size: 24px;">${emoji('semente')}</span>
                <div>
                  <strong>Leitor Semente</strong>
                  <p style="font-size: 11px; color: var(--muted);">Primeira leitura concluída</p>
                </div>
              </div>

              <div style="display: flex; align-items: center; gap: 10px; background: var(--surface2); padding: 10px; border-radius: var(--radius);">
                <span style="font-size: 24px;">${emoji('brotinho')}</span>
                <div>
                  <strong>Catingueiro Ativo</strong>
                  <p style="font-size: 11px; color: var(--muted);">3 dias de sequência mantidos</p>
                </div>
              </div>

              <div style="display: flex; align-items: center; gap: 10px; background: var(--surface2); padding: 10px; border-radius: var(--radius);">
                <span style="font-size: 24px;">${emoji('asa_branca')}</span>
                <div>
                  <strong>Mestre do Cordel</strong>
                  <p style="font-size: 11px; color: var(--muted);">Publicou mais de 5 posts no BookTok</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    async function handleUpdateProfile(e) {
      e.preventDefault();
      const name = $("#profName").value;
      const classGroup = $("#profClass").value;
      const avatarUrl = $("#profAvatar").value;

      try {
        await db.collection("users").doc(currentUser.uid).update({
          name,
          classGroup,
          avatarUrl
        });

        currentProfile.name = name;
        currentProfile.classGroup = classGroup;
        currentProfile.avatarUrl = avatarUrl;

        toast("Perfil atualizado com sucesso!", "success");
        renderApp();
      } catch (err) {
        toast("Erro ao atualizar perfil: " + err.message, "error");
      }
    }

    /* =========================================================
       12. PÁGINA: PAINEL DO PROFESSOR (RELATÓRIOS, PDF E CHARTS)
       ========================================================= */
    function renderTeacherPage() {
      if (currentProfile?.role !== "professor") {
        return `
          <div style="text-align: center; padding: 60px 20px;">
            <h2>Acesso Restrito</h2>
            <p style="color: var(--muted); margin-top: 8px;">Esta área é de uso exclusivo dos professores e equipe pedagógica.</p>
          </div>
        `;
      }

      setTimeout(() => initTeacherCharts(), 100);

      return `
        <div class="page-title">
          <div>
            <h1>Painel Pedagógico 📊</h1>
            <p>Gerencie o engajamento de leitura, turmas e pareceres dos alunos.</p>
          </div>
          <button class="primary-btn" onclick="exportPDFReport()">
            📄 Exportar Relatório em PDF
          </button>
        </div>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-label">Turmas Ativas</div>
            <div class="stat-value">5 Turmas</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Total de Leituras</div>
            <div class="stat-value">128 Livros</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Posts no BookTok</div>
            <div class="stat-value">45 Resenhas</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Média de Páginas/Aluno</div>
            <div class="stat-value">142 Págs</div>
          </div>
        </div>

        <div id="pdfExportContainer" class="panel" style="margin-top: 20px;">
          <div class="panel-header">
            <h2>Evolução e Engajamento da Turma</h2>
          </div>

          <div class="chart-grid">
            <div class="chart-card">
              <h3 style="font-size: 14px; margin-bottom: 12px; color: var(--muted);">Livros Lidos por Turma</h3>
              <div class="chart-container">
                <canvas id="booksChart"></canvas>
              </div>
            </div>

            <div class="chart-card">
              <h3 style="font-size: 14px; margin-bottom: 12px; color: var(--muted);">Engajamento Semanal (Posts/Curtidas)</h3>
              <div class="chart-container">
                <canvas id="engagementChart"></canvas>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function initTeacherCharts() {
      const booksCtx = document.getElementById('booksChart')?.getContext('2d');
      const engCtx = document.getElementById('engagementChart')?.getContext('2d');

      if (booksCtx) {
        new Chart(booksCtx, {
          type: 'bar',
          data: {
            labels: ['5º Ano', '6º Ano', '7º Ano', '8º Ano', '9º Ano'],
            datasets: [{
              label: 'Livros Concluídos',
              data: [32, 28, 19, 24, 25],
              backgroundColor: 'rgba(37, 99, 235, 0.7)',
              borderColor: '#2563EB',
              borderWidth: 1
            }]
          },
          options: { responsive: true, maintainAspectRatio: false }
        });
      }

      if (engCtx) {
        new Chart(engCtx, {
          type: 'line',
          data: {
            labels: ['Sem 1', 'Sem 2', 'Sem 3', 'Sem 4'],
            datasets: [{
              label: 'Interações no BookTok',
              data: [12, 19, 3, 25],
              borderColor: '#10B981',
              backgroundColor: 'rgba(16, 185, 129, 0.1)',
              fill: true,
              tension: 0.3
            }]
          },
          options: { responsive: true, maintainAspectRatio: false }
        });
      }
    }

    function exportPDFReport() {
      const element = document.getElementById('pdfExportContainer');
      if (!element) return toast("Conteúdo para PDF não encontrado.", "error");

      toast("Gerando PDF, aguarde...", "info");
      const opt = {
        margin:       10,
        filename:     'Relatorio_Sertao_Literario.pdf',
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(element).save().then(() => {
        toast("Relatório baixado com sucesso!", "success");
      }).catch(err => {
        console.error(err);
        toast("Erro ao gerar PDF.", "error");
      });
    }

    /* =========================================================
       13. MODAIS DE AUTENTICAÇÃO E COMENTÁRIOS
       ========================================================= */
    function openAuthModal(mode = 'login') {
      const body = mode === 'login' ? `
        <form class="form-grid" onsubmit="handleLogin(event)">
          <label>
            E-mail
            <input type="email" id="loginEmail" required placeholder="seu@email.com">
          </label>
          <label>
            Senha
            <input type="password" id="loginPassword" required placeholder="******">
          </label>
          <button type="submit" class="primary-btn full" style="margin-top: 10px;">Entrar</button>
          <p style="text-align: center; font-size: 13px; margin-top: 8px;">
            Não tem uma conta? <a href="#" onclick="openAuthModal('register'); return false;">Cadastre-se</a>
          </p>
        </form>
      ` : `
        <form class="form-grid" onsubmit="handleRegister(event)">
          <label>
            Nome Completo
            <input type="text" id="regName" required placeholder="Ex: Maria da Silva">
          </label>
          <label>
            E-mail
            <input type="email" id="regEmail" required placeholder="seu@email.com">
          </label>
          <label>
            Senha
            <input type="password" id="regPassword" required minlength="6" placeholder="Mínimo 6 caracteres">
          </label>
          <label>
            Tipo de Perfil
            <select id="regRole">
              <option value="aluno">Aluno(a)</option>
              <option value="professor">Professor(a)</option>
            </select>
          </label>
          <label>
            Turma
            <select id="regClass">
              <option value="5º Ano">5º Ano</option>
              <option value="6º Ano">6º Ano</option>
              <option value="7º Ano">7º Ano</option>
              <option value="8º Ano">8º Ano</option>
              <option value="9º Ano">9º Ano</option>
            </select>
          </label>
          <button type="submit" class="primary-btn full" style="margin-top: 10px;">Criar Conta</button>
          <p style="text-align: center; font-size: 13px; margin-top: 8px;">
            Já tem conta? <a href="#" onclick="openAuthModal('login'); return false;">Faça Login</a>
          </p>
        </form>
      `;

      openModal(mode === 'login' ? '🔑 Entrar no Sertão Literário' : '📝 Criar Conta', body);
    }

    async function openCommentsModal(postId) {
      const body = `
        <div id="commentsList" style="max-height: 250px; overflow-y: auto; margin-bottom: 16px; display: flex; flex-direction: column; gap: 10px;">
          <p style="color: var(--muted); font-size: 13px;">Carregando comentários...</p>
        </div>

        ${currentUser ? `
          <form class="form-grid" onsubmit="handleAddComment(event, '${postId}')">
            <input type="text" id="commentTextInput" required placeholder="Escreva um comentário...">
            <button type="submit" class="primary-btn full">Enviar Comentário</button>
          </form>
        ` : `
          <p style="font-size: 12px; color: var(--muted); text-align: center;">Faça login para comentar.</p>
        `}
      `;

      openModal("💬 Comentários", body);
      loadComments(postId);
    }

    async function loadComments(postId) {
      const list = $("#commentsList");
      if (!list) return;

      try {
        const snap = await db.collection("posts").doc(postId).collection("comments").orderBy("createdAt", "asc").get();
        if (snap.empty) {
          list.innerHTML = `<p style="color: var(--muted); font-size: 13px;">Seja o primeiro a comentar!</p>`;
          return;
        }

        list.innerHTML = snap.docs.map(doc => {
          const c = doc.data();
          return `
            <div style="background: var(--surface2); padding: 8px 12px; border-radius: var(--radius); font-size: 13px;">
              <strong>${c.userName || 'Anônimo'}</strong>: ${c.text}
            </div>
          `;
        }).join('');
      } catch (err) {
        list.innerHTML = `<p style="color: var(--danger); font-size: 13px;">Erro ao carregar comentários.</p>`;
      }
    }

    async function handleAddComment(e, postId) {
      e.preventDefault();
      const input = $("#commentTextInput");
      const text = input.value;
      if (!text) return;

      try {
        await db.collection("posts").doc(postId).collection("comments").add({
          text,
          userId: currentUser.uid,
          userName: currentProfile?.name || "Anônimo",
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        await db.collection("posts").doc(postId).update({
          commentsCount: firebase.firestore.FieldValue.increment(1)
        });

        input.value = "";
        loadComments(postId);
        toast("Comentário adicionado!");
      } catch (err) {
        toast("Erro ao comentar: " + err.message, "error");
      }
    }

    /* INICIALIZAÇÃO AUTOMÁTICA DA APLICAÇÃO */
    document.addEventListener("DOMContentLoaded", () => {
      renderApp();
    });
  </script>
</body>
</html>
